<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1B2A4A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#243B66;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pinShadow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:0.08" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0" />
    </linearGradient>
  </defs>

  <!-- Drop shadow -->
  <ellipse cx="256" cy="448" rx="60" ry="16" fill="url(#pinShadow)" />

  <!-- Location Pin Body -->
  <path d="
    M 256 440
    C 256 440, 160 310, 160 220
    C 160 167, 203 120, 256 120
    C 309 120, 352 167, 352 220
    C 352 310, 256 440, 256 440
    Z
  " fill="url(#pinGrad)" />

  <!-- Inner circle highlight for depth -->
  <circle cx="256" cy="220" r="72" fill="#FFFFFF" opacity="0.95" />

  <!-- Parking "P" — bold, clean -->
  <path d="
    M 228 200
    L 228 252
    L 244 252
    L 244 234
    L 260 234
    C 276 234, 284 226, 284 217
    C 284 208, 278 200, 262 200
    Z
  " fill="#1B2A4A" />

  <!-- P horizontal stroke detail -->
  <rect x="244" y="210" width="26" height="12" rx="4" fill="#FFB800" />

  <!-- Pin highlight (top-left shine) -->
  <ellipse cx="228" cy="170" rx="48" ry="32" fill="#FFFFFF" opacity="0.08" />

  <!-- Text: PARKING -->
  <text x="256" y="380" text-anchor="middle" font-family="'Montserrat','Helvetica Neue',Arial,sans-serif" font-weight="700" font-size="48" fill="#1B2A4A" letter-spacing="6">PARKING</text>

  <!-- Text: Ashtabula -->
  <text x="256" y="410" text-anchor="middle" font-family="'Open Sans','Segoe UI',Arial,sans-serif" font-weight="400" font-size="20" fill="#7F8C8D" letter-spacing="4">ASHTABULA</text>
</svg>
