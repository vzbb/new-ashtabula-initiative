<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7fafc"/>
      <stop offset="100%" stop-color="#edf3f7"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2c5282"/>
      <stop offset="100%" stop-color="#1f3d63"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38a169"/>
      <stop offset="100%" stop-color="#2f855a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38a169"/>
      <stop offset="100%" stop-color="#2c5282"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bgGrad)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.04">
    <line x1="0" y1="120" x2="1280" y2="120" stroke="#2c5282" stroke-width="1"/>
    <line x1="0" y1="240" x2="1280" y2="240" stroke="#2c5282" stroke-width="1"/>
    <line x1="0" y1="360" x2="1280" y2="360" stroke="#2c5282" stroke-width="1"/>
    <line x1="0" y1="480" x2="1280" y2="480" stroke="#2c5282" stroke-width="1"/>
    <line x1="0" y1="600" x2="1280" y2="600" stroke="#2c5282" stroke-width="1"/>
    <line x1="160" y1="0" x2="160" y2="720" stroke="#2c5282" stroke-width="1"/>
    <line x1="320" y1="0" x2="320" y2="720" stroke="#2c5282" stroke-width="1"/>
    <line x1="480" y1="0" x2="480" y2="720" stroke="#2c5282" stroke-width="1"/>
    <line x1="640" y1="0" x2="640" y2="720" stroke="#2c5282" stroke-width="1"/>
    <line x1="800" y1="0" x2="800" y2="720" stroke="#2c5282" stroke-width="1"/>
    <line x1="960" y1="0" x2="960" y2="720" stroke="#2c5282" stroke-width="1"/>
    <line x1="1120" y1="0" x2="1120" y2="720" stroke="#2c5282" stroke-width="1"/>
  </g>

  <!-- Left Section: AMHA Staff at Desk -->
  <g transform="translate(80, 160)">
    <!-- Desk base -->
    <rect x="0" y="260" width="380" height="20" rx="6" fill="#1f3d63" opacity="0.12"/>
    <!-- Desk surface -->
    <rect x="-10" y="240" width="400" height="24" rx="8" fill="white" stroke="#2c5282" stroke-width="1" opacity="0.5"/>

    <!-- Monitor -->
    <rect x="50" y="80" width="180" height="150" rx="10" fill="white" stroke="#2c5282" stroke-width="2"/>
    <rect x="55" y="85" width="170" height="120" rx="6" fill="#f7fafc"/>
    <!-- Dashboard screen content -->
    <rect x="65" y="95" width="50" height="14" rx="4" fill="#1f3d63"/>
    <rect x="65" y="115" width="150" height="8" rx="3" fill="#2c5282" opacity="0.2"/>
    <rect x="65" y="130" width="150" height="8" rx="3" fill="#38a169" opacity="0.2"/>
    <rect x="65" y="145" width="150" height="8" rx="3" fill="#2c5282" opacity="0.15"/>
    <rect x="65" y="165" width="60" height="20" rx="6" fill="#38a169"/>
    <rect x="135" y="165" width="60" height="20" rx="6" fill="#2c5282"/>
    <!-- Monitor stand -->
    <rect x="125" y="230" width="30" height="14" rx="3" fill="#617285"/>
    <rect x="100" y="240" width="80" height="6" rx="3" fill="#617285"/>

    <!-- Person: AMHA staff -->
    <g transform="translate(280, 30)">
      <!-- Body -->
      <rect x="-5" y="60" width="50" height="70" rx="14" fill="#2c5282"/>
      <!-- Collar/lapel -->
      <rect x="10" y="60" width="20" height="30" rx="6" fill="#1f3d63"/>
      <!-- Head -->
      <circle cx="20" cy="28" r="28" fill="#edf3f7"/>
      <circle cx="10" cy="26" r="3" fill="#617285"/>
      <circle cx="30" cy="26" r="3" fill="#617285"/>
      <path d="M8 38 Q20 46 32 38" stroke="#617285" stroke-width="2" fill="none" stroke-linecap="round"/>
      <!-- Hair -->
      <ellipse cx="20" cy="16" rx="22" ry="14" fill="#2c5282" opacity="0.7"/>
    </g>

    <!-- Floating icons above desk -->
    <g transform="translate(300, -20)">
      <!-- Clipboard with checkmark -->
      <rect x="0" y="10" width="30" height="38" rx="5" fill="white" stroke="#38a169" stroke-width="2"/>
      <rect x="6" y="5" width="18" height="8" rx="2" fill="#38a169"/>
      <line x1="8" y1="24" x2="14" y2="30" stroke="#38a169" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="14" y1="30" x2="22" y2="20" stroke="#38a169" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- House icon -->
    <g transform="translate(340, 50)" opacity="0.6">
      <path d="M0 20 L18 2 L36 20" stroke="#38a169" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="8" y="18" width="20" height="16" rx="2" fill="#f7fafc" stroke="#38a169" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Center Connector: Arrow flow -->
  <g transform="translate(470, 310)">
    <line x1="0" y1="30" x2="100" y2="30" stroke="#38a169" stroke-width="4" stroke-dasharray="8 6"/>
    <polygon points="110,30 95,22 95,38" fill="#38a169"/>
    <circle cx="0" cy="30" r="10" fill="white" stroke="#38a169" stroke-width="2"/>
    <path d="M-4 30 L0 25 L4 30 L0 35 Z" fill="#38a169" transform="scale(0.7)"/>
  </g>

  <!-- Right Section: Housing Complex -->
  <g transform="translate(640, 120)">
    <!-- Building 1 -->
    <g transform="translate(0, 120)">
      <rect x="0" y="20" width="100" height="170" rx="6" fill="white" stroke="#2c5282" stroke-width="2"/>
      <!-- Roof -->
      <path d="M-8 20 L50 -20 L108 20" fill="#2c5282" opacity="0.15"/>
      <path d="M-4 20 L50 -14 L104 20" fill="none" stroke="#2c5282" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Windows -->
      <rect x="12" y="40" width="30" height="35" rx="4" fill="#edf3f7" stroke="#2c5282" stroke-width="1"/>
      <rect x="58" y="40" width="30" height="35" rx="4" fill="#edf3f7" stroke="#2c5282" stroke-width="1"/>
      <rect x="12" y="85" width="30" height="35" rx="4" fill="#edf3f7" stroke="#2c5282" stroke-width="1"/>
      <rect x="58" y="85" width="30" height="35" rx="4" fill="#edf3f7" stroke="#2c5282" stroke-width="1"/>
      <!-- Door -->
      <rect x="35" y="140" width="30" height="50" rx="4" fill="#1f3d63"/>
      <circle cx="57" cy="168" r="3" fill="#38a169"/>
    </g>

    <!-- Building 2 -->
    <g transform="translate(130, 80)">
      <rect x="0" y="40" width="110" height="220" rx="6" fill="white" stroke="#2c5282" stroke-width="2"/>
      <!-- Roof -->
      <path d="M-8 40 L55 -10 L118 40" fill="none" stroke="#2c5282" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Windows -->
      <rect x="14" y="60" width="35" height="40" rx="4" fill="#edf3f7" stroke="#2c5282" stroke-width="1"/>
      <rect x="61" y="60" width="35" height="40" rx="4" fill="#edf3f7" stroke="#2c5282" stroke-width="1"/>
      <rect x="14" y="110" width="35" height="40" rx="4" fill="#edf3f7" stroke="#2c5282" stroke-width="1"/>
      <rect x="61" y="110" width="35" height="40" rx="4" fill="#edf3f7" stroke="#2c5282" stroke-width="1"/>
      <rect x="14" y="160" width="35" height="40" rx="4" fill="#edf3f7" stroke="#2c5282" stroke-width="1"/>
      <rect x="61" y="160" width="35" height="40" rx="4" fill="#edf3f7" stroke="#2c5282" stroke-width="1"/>
      <!-- Door -->
      <rect x="40" y="200" width="30" height="60" rx="4" fill="#1f3d63"/>
      <circle cx="62" cy="232" r="3" fill="#38a169"/>
    </g>

    <!-- Building 3 (smaller) -->
    <g transform="translate(270, 160)">
      <rect x="0" y="20" width="80" height="140" rx="6" fill="white" stroke="#2c5282" stroke-width="2"/>
      <path d="M-6 20 L40 -16 L86 20" fill="none" stroke="#2c5282" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="10" y="36" width="25" height="28" rx="3" fill="#edf3f7" stroke="#2c5282" stroke-width="1"/>
      <rect x="45" y="36" width="25" height="28" rx="3" fill="#edf3f7" stroke="#2c5282" stroke-width="1"/>
      <rect x="25" y="110" width="30" height="50" rx="4" fill="#1f3d63"/>
      <circle cx="47" cy="136" r="3" fill="#38a169"/>
    </g>

    <!-- Trees between buildings -->
    <g opacity="0.4">
      <ellipse cx="-20" cy="280" rx="18" ry="25" fill="#38a169"/>
      <rect x="-23" y="298" width="6" height="15" rx="2" fill="#617285"/>
      <ellipse cx="250" cy="250" rx="15" ry="22" fill="#2f855a"/>
      <rect x="247" y="266" width="6" height="12" rx="2" fill="#617285"/>
      <ellipse cx="370" cy="270" rx="12" ry="18" fill="#38a169" opacity="0.6"/>
      <rect x="367" y="283" width="6" height="10" rx="2" fill="#617285"/>
    </g>
  </g>

  <!-- Repair/Maintenance Floating Icons -->
  <g transform="translate(600, 100)">
    <!-- Wrench -->
    <circle cx="0" cy="0" r="22" fill="white" stroke="#2c5282" stroke-width="1.5"/>
    <path d="M-8 32 L-8 14 Q-8 8 -4 6 L6 18 Q4 20 4 24 L-4 32 Z" fill="#2c5282" opacity="0.7" transform="translate(0,-18)"/>
  </g>

  <g transform="translate(770, 70)">
    <!-- Checkmark badge -->
    <circle cx="0" cy="0" r="22" fill="#38a169" opacity="0.9"/>
    <path d="M-8 0 L-3 6 L9 -7" stroke="white" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(530, 450)">
    <!-- Document/speech bubble -->
    <rect x="-30" y="-20" width="60" height="40" rx="10" fill="white" stroke="#2c5282" stroke-width="1.5"/>
    <polygon points="10,20 15,32 22,20" fill="white" stroke="#2c5282" stroke-width="1.5"/>
    <rect x="-20" y="-10" width="40" height="4" rx="2" fill="#2c5282" opacity="0.2"/>
    <rect x="-20" y="-2" width="40" height="4" rx="2" fill="#38a169" opacity="0.2"/>
    <rect x="-20" y="6" width="30" height="4" rx="2" fill="#2c5282" opacity="0.15"/>
  </g>

  <!-- Bottom decorative gradient bar -->
  <rect x="0" y="690" width="1280" height="30" fill="url(#accentGrad)" opacity="0.08"/>

  <!-- Leaf motif bottom-left -->
  <g transform="translate(60, 620)" opacity="0.12">
    <path d="M0 40 Q10 20 30 10 Q20 30 10 40 Z" fill="#38a169"/>
    <path d="M30 10 Q40 20 40 40 Q30 30 10 40 Z" fill="#2c5282"/>
    <line x1="20" y1="30" x2="20" y2="50" stroke="#38a169" stroke-width="2"/>
  </g>

  <!-- Leaf motif bottom-right -->
  <g transform="translate(1200, 620) scale(-1,1)" opacity="0.12">
    <path d="M0 40 Q10 20 30 10 Q20 30 10 40 Z" fill="#38a169"/>
    <path d="M30 10 Q40 20 40 40 Q30 30 10 40 Z" fill="#2c5282"/>
    <line x1="20" y1="30" x2="20" y2="50" stroke="#38a169" stroke-width="2"/>
  </g>
</svg>
