<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <defs>
    <linearGradient id="sms-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#319795"/>
      <stop offset="100%" stop-color="#276F6E"/>
    </linearGradient>
  </defs>

  <!-- Chat/SMS bubble body -->
  <rect x="24" y="24" width="200" height="176" rx="32" ry="32" fill="url(#sms-grad)"/>

  <!-- Bubble tail (bottom-left) -->
  <path d="M 24 172 L 24 208 L 60 172 Z" fill="#276F6E"/>

  <!-- White inner card / calendar area -->
  <rect x="52" y="60" width="144" height="110" rx="16" ry="16" fill="white" opacity="0.95"/>

  <!-- Calendar teal header bar -->
  <rect x="52" y="60" width="144" height="36" rx="16" ry="16" fill="#2B6CB0"/>
  <rect x="52" y="86" width="144" height="10" fill="#2B6CB0"/>

  <!-- Calendar date number -->
  <text x="124" y="85" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="white" text-anchor="middle">15</text>

  <!-- Day dots on calendar -->
  <circle cx="76" cy="108" r="3" fill="rgba(43,108,176,0.2)"/>
  <circle cx="98" cy="108" r="3" fill="rgba(43,108,176,0.2)"/>
  <circle cx="120" cy="108" r="3" fill="rgba(43,108,176,0.2)"/>
  <circle cx="142" cy="108" r="3" fill="rgba(43,108,176,0.2)"/>
  <circle cx="164" cy="108" r="3" fill="rgba(43,108,176,0.2)"/>
  <circle cx="76" cy="128" r="3" fill="rgba(43,108,176,0.15)"/>
  <circle cx="98" cy="128" r="3" fill="rgba(43,108,176,0.15)"/>
  <circle cx="120" cy="128" r="3" fill="rgba(43,108,176,0.15)"/>
  <circle cx="164" cy="128" r="3" fill="rgba(43,108,176,0.15)"/>

  <!-- Check mark overlay (confirmed appointment) -->
  <circle cx="162" cy="80" r="16" fill="#34d399" opacity="0.9"/>
  <path d="M 155 80 L 160 85 L 169 75" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Dots indicator (bottom of chat bubble) -->
  <circle cx="128" cy="162" r="3" fill="rgba(255,255,255,0.3)"/>
  <circle cx="144" cy="162" r="3" fill="rgba(255,255,255,0.3)"/>
  <circle cx="160" cy="162" r="3" fill="rgba(255,255,255,0.3)"/>

  <!-- Ring clips (top of bubble — like a pinboard) -->
  <circle cx="80" cy="24" r="8" fill="#2B6CB0"/>
  <circle cx="176" cy="24" r="8" fill="#2B6CB0"/>
  <circle cx="80" cy="24" r="4" fill="white" opacity="0.8"/>
  <circle cx="176" cy="24" r="4" fill="white" opacity="0.8"/>

  <!-- Small message lines -->
  <line x1="68" y1="146" x2="108" y2="146" stroke="rgba(255,255,255,0.25)" stroke-width="2" stroke-linecap="round"/>
  <line x1="68" y1="156" x2="92" y2="156" stroke="rgba(255,255,255,0.15)" stroke-width="2" stroke-linecap="round"/>
</svg>
