<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" width="200" height="160">
  <defs>
    <style>
      .pm-heart { fill: #ED8936; }
      .pm-pad { fill: #FFFAF0; }
    </style>
  </defs>

  <!--
    Pet Match Stacked Logo (Mobile Variant)
    ────────────────────────────────────────
    Vertical lockup for narrow screens (< 480px).
    Heart-paw icon centered above "Pet" / "Match" stacked wordmark.
  -->

  <!-- Icon: Heart-paw (80×80, centered) -->
  <g transform="translate(60, 4)" aria-label="Pet Match icon">
    <path d="M 40 78 
             C 40 78, 4 50, 4 30 
             C 4 14, 18 2, 26 14 
             C 32 20, 36 26, 40 30 
             C 44 26, 48 20, 54 14 
             C 62 2, 76 14, 76 30 
             C 76 50, 40 78, 40 78 Z" 
          class="pm-heart"/>
    <path d="M 27 46 C 27 40, 32 37, 40 37 C 48 37, 53 40, 53 46 C 53 54, 47 58, 40 58 C 33 58, 27 54, 27 46 Z" class="pm-pad"/>
    <ellipse cx="18" cy="34" rx="5" ry="3.5" class="pm-pad" transform="rotate(-15, 18, 34)"/>
    <ellipse cx="30" cy="24" rx="5.5" ry="3.5" class="pm-pad" transform="rotate(-5, 30, 24)"/>
    <ellipse cx="50" cy="24" rx="5.5" ry="3.5" class="pm-pad" transform="rotate(5, 50, 24)"/>
    <ellipse cx="62" cy="34" rx="5" ry="3.5" class="pm-pad" transform="rotate(15, 62, 34)"/>
  </g>

  <!-- Wordmark: Pet above Match, centered -->
  <g transform="translate(100, 102)" aria-label="Pet Match wordmark">
    <text x="0" y="0" text-anchor="middle"
          font-family="'Fredoka', 'Nunito', 'Segoe UI', 'Arial Rounded MT Bold', 'Helvetica Rounded', Arial, sans-serif" 
          font-weight="700" font-size="36" fill="#4A5568" letter-spacing="-0.5">
      Pet
    </text>
    <text x="0" y="32" text-anchor="middle"
          font-family="'Fredoka', 'Nunito', 'Segoe UI', 'Arial Rounded MT Bold', 'Helvetica Rounded', Arial, sans-serif" 
          font-weight="700" font-size="36" fill="#4A5568" letter-spacing="-0.5">
      Match
    </text>
    <text x="0" y="52" text-anchor="middle"
          font-family="'Nunito', 'Segoe UI', Arial, sans-serif" 
          font-weight="600" font-size="10" fill="#718096" letter-spacing="4">
      ADOPTION MATCHING
    </text>
  </g>
</svg>
