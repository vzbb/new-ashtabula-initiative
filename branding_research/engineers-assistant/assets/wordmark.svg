<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="navy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1B3A5C"/>
      <stop offset="100%" style="stop-color:#1B3A5C"/>
    </linearGradient>
  </defs>
  
  <!-- Simplified gear icon -->
  <g transform="translate(5, 12)">
    <!-- Outer gear -->
    <circle cx="28" cy="28" r="24" fill="none" stroke="#1B3A5C" stroke-width="3"/>
    <circle cx="28" cy="28" r="15" fill="none" stroke="#1B3A5C" stroke-width="3"/>
    <!-- Gear teeth (simplified as cross) -->
    <line x1="28" y1="1" x2="28" y2="10" stroke="#1B3A5C" stroke-width="3" stroke-linecap="round"/>
    <line x1="28" y1="46" x2="28" y2="55" stroke="#1B3A5C" stroke-width="3" stroke-linecap="round"/>
    <line x1="1" y1="28" x2="10" y2="28" stroke="#1B3A5C" stroke-width="3" stroke-linecap="round"/>
    <line x1="46" y1="28" x2="55" y2="28" stroke="#1B3A5C" stroke-width="3" stroke-linecap="round"/>
    <!-- Center dot for the "A" -->
    <text x="28" y="34" font-family="'Georgia', serif" font-size="16" font-weight="700" fill="#1B3A5C" text-anchor="middle">A</text>
  </g>
  
  <!-- Wordmark -->
  <g transform="translate(72, 0)">
    <text x="0" y="32" font-family="'Georgia', 'Times New Roman', serif" font-size="18" font-weight="700" fill="#1B3A5C" letter-spacing="0.5">City of Ashtabula</text>
    <text x="0" y="56" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="600" fill="#4A7C9B" letter-spacing="1.5">ENGINEERING DIVISION</text>
    <line x1="0" y1="42" x2="248" y2="42" stroke="#C8A84E" stroke-width="1.5" opacity="0.6"/>
  </g>
</svg>
