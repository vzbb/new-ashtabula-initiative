<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="hvac-nav" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E4D8C"/>
      <stop offset="100%" stop-color="#163d70"/>
    </linearGradient>
    <linearGradient id="hvac-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E85A24"/>
      <stop offset="100%" stop-color="#d44a1a"/>
    </linearGradient>
  </defs>

  <!-- Icon: Stylized flame and snowflake dual-nature mark -->
  <g transform="translate(10, 10)">
    <!-- Hexagonal background -->
    <polygon points="50,0 95,28 95,72 50,100 5,72 5,28" fill="url(#hvac-nav)" opacity="0.08"/>
    <polygon points="50,5 90,30 90,70 50,95 10,70 10,30" fill="none" stroke="url(#hvac-nav)" stroke-width="2"/>

    <!-- Flame shape (H) -->
    <path d="M30 65 C25 55, 20 45, 25 35 C28 30, 32 28, 35 25 C33 35, 36 45, 40 50 C42 52, 44 48, 42 42 C40 36, 42 28, 48 22 C50 30, 52 40, 48 50 C46 55, 48 60, 52 65 Z"
          fill="url(#hvac-orange)" opacity="0.9"/>

    <!-- Snowflake/gear accent (C) -->
    <circle cx="70" cy="45" r="14" fill="none" stroke="url(#hvac-nav)" stroke-width="2.5"/>
    <line x1="70" y1="28" x2="70" y2="62" stroke="url(#hvac-nav)" stroke-width="1.5" opacity="0.6"/>
    <line x1="56" y1="45" x2="84" y2="45" stroke="url(#hvac-nav)" stroke-width="1.5" opacity="0.6"/>
    <line x1="60" y1="35" x2="80" y2="55" stroke="url(#hvac-nav)" stroke-width="1.5" opacity="0.4"/>
    <line x1="80" y1="35" x2="60" y2="55" stroke="url(#hvac-nav)" stroke-width="1.5" opacity="0.4"/>

    <!-- Small flame detail -->
    <path d="M68 40 C66 36, 70 32, 72 38 C74 42, 70 44, 68 40Z" fill="#E85A24" opacity="0.5"/>
  </g>

  <!-- Company name -->
  <text x="115" y="48" font-family="'Inter', 'Montserrat', 'Helvetica Neue', Arial, sans-serif" font-size="32" font-weight="800" fill="#1E4D8C" letter-spacing="2">HAVE</text>

  <!-- Subtitle -->
  <text x="115" y="70" font-family="'Inter', 'Montserrat', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#E85A24" letter-spacing="3">HEATING &amp; COOLING</text>

  <!-- Tagline -->
  <text x="115" y="90" font-family="'Inter', Arial, sans-serif" font-size="11" fill="#6B7280" letter-spacing="1.5">EST. 1975 · ASHTABULA, OH</text>

  <!-- Divider -->
  <line x1="115" y1="62" x2="380" y2="62" stroke="#E85A24" stroke-width="1.5" opacity="0.3"/>
</svg>
