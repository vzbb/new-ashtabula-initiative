<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c7a45a"/>
      <stop offset="100%" stop-color="#d4b87a"/>
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22314f"/>
      <stop offset="100%" stop-color="#15253d"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#22314f" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background frame (soft pill) -->
  <rect x="0" y="25" width="600" height="150" rx="28" ry="28" fill="none" stroke="#f0ede4" stroke-width="1"/>

  <!-- === ICON MARK === -->
  <g transform="translate(38, 90)">
    <!-- Outer circle -->
    <circle cx="0" cy="0" r="42" fill="none" stroke="url(#goldGrad)" stroke-width="2.5"/>
    <!-- Inner circle -->
    <circle cx="0" cy="0" r="28" fill="none" stroke="url(#navyGrad)" stroke-width="2"/>

    <!-- Stylized infinity/legacy knot -->
    <path d="M-12,-18 C-4,-24 4,-24 12,-18 C20,-12 20,0 12,6 C4,12 -4,12 -12,6 C-20,0 -20,-12 -12,-18Z"
          fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.7"/>
    <path d="M-12,18 C-4,24 4,24 12,18 C20,12 20,0 12,-6 C4,-12 -4,-12 -12,-6 C-20,0 -20,12 -12,18Z"
          fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.5"/>

    <!-- Center diamond - legacy gem -->
    <rect x="-6" y="-6" width="12" height="12" rx="2" fill="url(#goldGrad)" transform="rotate(45)"/>

    <!-- Connecting links left and right -->
    <line x1="-42" y1="0" x2="-28" y2="0" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.4"/>
    <line x1="28" y1="0" x2="42" y2="0" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.4"/>
  </g>

  <!-- === WORDMARK === -->
  <g transform="translate(130, 65)" filter="url(#softShadow)">
    <!-- Legacy -->
    <text x="0" y="0" font-family="'Crimson Pro', 'Georgia', serif" font-size="42" font-weight="600" fill="url(#navyGrad)" letter-spacing="1">
      Legacy
    </text>
    <!-- Link -->
    <text x="178" y="0" font-family="'Crimson Pro', 'Georgia', serif" font-size="42" font-weight="400" fill="url(#goldGrad)" letter-spacing="1">
      Link
    </text>
  </g>

  <!-- === SUB-BRAND === -->
  <g transform="translate(132, 115)">
    <text x="0" y="0" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="11" font-weight="500" fill="#6f7888" letter-spacing="3.5" text-transform="uppercase">
      A DUCRO FUNERAL SERVICES TOOL
    </text>
    <!-- Thin gold accent line -->
    <rect x="0" y="8" width="40" height="2" rx="1" fill="url(#goldGrad)" opacity="0.5"/>
  </g>

</svg>
