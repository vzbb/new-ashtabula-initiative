<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <pattern id="fg" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="translate(4, 4)">
      <path d="M 8 0 L 0 0 0 8" fill="none" stroke="#2A6FB0" stroke-width="0.5" opacity="0.15"/>
    </pattern>
    <pattern id="fgSmall" width="2" height="2" patternUnits="userSpaceOnUse" patternTransform="translate(4, 4)">
      <path d="M 2 0 L 0 0 0 2" fill="none" stroke="#2A6FB0" stroke-width="0.2" opacity="0.08"/>
    </pattern>
  </defs>
  <!-- Background -->
  <rect width="64" height="64" rx="10" fill="#1B3A5C"/>
  <rect width="64" height="64" rx="10" fill="url(#fgSmall)"/>
  <rect width="64" height="64" rx="10" fill="url(#fg)"/>
  <!-- Border -->
  <rect x="3" y="3" width="58" height="58" rx="7" fill="none" stroke="white" stroke-width="1" opacity="0.25"/>
  <!-- Drafting triangle -->
  <polygon points="32,56 10,10 54,10" fill="none" stroke="white" stroke-width="2.5" stroke-linejoin="round" opacity="0.95"/>
  <!-- Building elevation -->
  <g opacity="0.85">
    <rect x="22" y="28" width="20" height="24" fill="none" stroke="white" stroke-width="1.5"/>
    <line x1="22" y1="40" x2="42" y2="40" stroke="white" stroke-width="0.8" opacity="0.5"/>
    <polyline points="20,28 32,14 44,28" fill="none" stroke="white" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Windows -->
    <rect x="25" y="32" width="5" height="6" fill="none" stroke="white" stroke-width="0.8" opacity="0.4"/>
    <rect x="34" y="32" width="5" height="6" fill="none" stroke="white" stroke-width="0.8" opacity="0.4"/>
    <!-- Door -->
    <rect x="28" y="44" width="8" height="8" fill="none" stroke="white" stroke-width="0.8" opacity="0.4"/>
  </g>
  <!-- Approval stamp accent -->
  <g transform="translate(44, 46) rotate(-8)">
    <rect x="0" y="0" width="18" height="12" rx="2" fill="none" stroke="#D97706" stroke-width="1.5" opacity="0.85"/>
    <text x="9" y="8" fill="#D97706" font-size="4" font-family="monospace" text-anchor="middle" font-weight="bold" letter-spacing="0.5" opacity="0.85">OK</text>
  </g>
  <!-- Crosshair -->
  <g transform="translate(38, 22)" opacity="0.4">
    <circle cx="0" cy="0" r="2" fill="none" stroke="#D97706" stroke-width="0.6"/>
    <line x1="-4" y1="0" x2="-3" y2="0" stroke="#D97706" stroke-width="0.5"/>
    <line x1="3" y1="0" x2="4" y2="0" stroke="#D97706" stroke-width="0.5"/>
    <line x1="0" y1="-4" x2="0" y2="-3" stroke="#D97706" stroke-width="0.5"/>
    <line x1="0" y1="3" x2="0" y2="4" stroke="#D97706" stroke-width="0.5"/>
  </g>
</svg>
