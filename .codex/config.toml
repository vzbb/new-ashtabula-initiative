# New Ashtabula Initiative Codex swarm configuration
#
# This file is the machine-readable execution layer for the NAI parallel
# agent workflow. It complements README.md, SESSION_HANDBOOK.md,
# ARTIFACT_PIPELINE.md, SWARM_KICKOFF.md, and AGENTS.md.
#
# The project is intentionally configured as a bounded swarm:
# - enough threads to work in parallel
# - enough nesting depth for a coordinator to spawn specialists
# - clear role names with small, focused instruction layers

project_doc_fallback_filenames = ["README.md", "SESSION_HANDBOOK.md", "ARTIFACT_PIPELINE.md", "SWARM_KICKOFF.md", "AGENTS.md"]
project_doc_max_bytes = 32768
model = "gpt-5.4"
model_reasoning_effort = "medium"

[features]
multi_agent = true
unified_exec = true
shell_tool = true
shell_snapshot = true
apps = true
prevent_idle_sleep = true

[agents]
# Bounded parallelism for the current phase.
# Root sessions start at depth 0. With max_depth = 1, only the root coordinator
# can spawn specialists; workers stay in their lane and never recurse.
max_threads = 16
max_depth = 1
job_max_runtime_seconds = 7200

[agents.coordinator]
description = "Top-level orchestrator for NAI swarms. Reads canonical docs, assigns work, reconciles outputs, and protects the target map."
config_file = "./agents/coordinator.toml"
nickname_candidates = ["Atlas", "Helm", "Orion"]
model = "gpt-5.4"
model_reasoning_effort = "medium"

[agents.research]
description = "Lead-target research specialist. Reconciles the target map, lead research JSON, and prospect files."
config_file = "./agents/research.toml"
nickname_candidates = ["Scout", "Vector", "Mariner"]
model = "gpt-5.4-mini"
model_reasoning_effort = "medium"

[agents.brandkit]
description = "Brand system specialist. Turns research into brandkit JSON and keeps target order explicit."
config_file = "./agents/brandkit.toml"
nickname_candidates = ["Palette", "Signal", "Northstar"]
model = "gpt-5.4-mini"
model_reasoning_effort = "medium"

[agents.assets]
description = "Asset procurement specialist. Gathers logos, wordmarks, favicons, and brand reference material into branding_research."
config_file = "./agents/assets.toml"
nickname_candidates = ["Forge", "Canvas", "Mosaic"]
model = "gpt-5.4-mini"
model_reasoning_effort = "medium"

[agents.implementation]
description = "Site implementation specialist. Edits a single MVP at a time and keeps build, layout, and asset paths correct."
config_file = "./agents/implementation.toml"
nickname_candidates = ["Rivet", "Pilot", "Keystone"]
model = "gpt-5.4-mini"
model_reasoning_effort = "medium"

[agents.verification]
description = "Verification specialist. Runs builds, screenshots, and visual analysis checks against the live site."
config_file = "./agents/verification.toml"
nickname_candidates = ["Lens", "Axiom", "Pulse"]
model = "gpt-5.4"
model_reasoning_effort = "medium"

[agents.docs]
description = "Documentation and schema specialist. Updates repo docs only when the canonical workflow changes."
config_file = "./agents/docs.toml"
nickname_candidates = ["Ledger", "Index", "Quill"]
model = "gpt-5.4"
model_reasoning_effort = "medium"

[mcp_servers.mem0]
enabled = true
required = false
command = "/home/tt/.openclaw/workspace/projects/new-ashtabula-initiative/.codex/bin/mem0-mcp-server.sh"
env_vars = ["MEM0_API_KEY", "MEM0_DEFAULT_USER_ID"]
startup_timeout_sec = 30
tool_timeout_sec = 60
