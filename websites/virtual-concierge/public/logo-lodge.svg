<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" width="400" height="160">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4AF37;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8941F;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Decorative line above -->
  <line x1="60" y1="22" x2="340" y2="22" stroke="#D4AF37" stroke-width="1.5" opacity="0.5" />
  <!-- Decorative diamond -->
  <rect x="194" y="14" width="12" height="12" fill="url(#goldGrad)" transform="rotate(45 200 20)" rx="1" />
  <!-- Main title -->
  <text x="200" y="80" text-anchor="middle"
        font-family="'Playfair Display', Georgia, 'Times New Roman', serif"
        font-size="42" font-weight="700"
        fill="#1E3A5F"
        letter-spacing="0.12em">
    THE LODGE
  </text>
  <!-- Subtitle -->
  <text x="200" y="110" text-anchor="middle"
        font-family="'Playfair Display', Georgia, 'Times New Roman', serif"
        font-size="18" font-weight="500"
        fill="#8B7355"
        letter-spacing="0.08em"
        font-style="italic">
    at Geneva-on-the-Lake
  </text>
  <!-- Tagline -->
  <text x="200" y="140" text-anchor="middle"
        font-family="'Inter', -apple-system, sans-serif"
        font-size="10" font-weight="500"
        fill="#D4AF37"
        letter-spacing="0.15em"
        text-transform="uppercase">
    YOUR PERSONAL GUIDE TO WINE COUNTRY
  </text>
  <!-- Decorative line below -->
  <line x1="60" y1="150" x2="340" y2="150" stroke="#D4AF37" stroke-width="1.5" opacity="0.5" />
</svg>
