<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bellGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E8D5A3;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#D4AF37;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C9A84C;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bellHighlight" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF8E7;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#C9A84C;stop-opacity:0" />
    </linearGradient>
    <linearGradient id="clapperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4AF37;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8860B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A1628;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A2A44;stop-opacity:1" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" />
    </filter>
  </defs>

  <!-- Bell body -->
  <g transform="translate(256, 256)">
    <!-- Bell outline/shape -->
    <path d="
      M 0,-170
      C 70,-170 120,-120 120,-60
      L 120,-40
      C 120,-20 110,-10 100,10
      L 90,30
      C 85,40 80,45 70,50
      L -70,50
      C -80,45 -85,40 -90,30
      L -100,10
      C -110,-10 -120,-20 -120,-40
      L -120,-60
      C -120,-120 -70,-170 0,-170
      Z
    " fill="url(#bellGrad)" stroke="#B8860B" stroke-width="2.5" />

    <!-- Bell highlight overlay -->
    <path d="
      M -80,-130
      C -40,-160 20,-160 60,-140
      C 80,-128 90,-110 95,-90
    " fill="none" stroke="url(#bellHighlight)" stroke-width="12" stroke-linecap="round" opacity="0.5" />

    <!-- Bell top knob -->
    <circle cx="0" cy="-175" r="12" fill="url(#bellGrad)" stroke="#B8860B" stroke-width="2" />

    <!-- Bell rim -->
    <rect x="-90" y="48" width="180" height="12" rx="6" fill="#B8860B" />

    <!-- Clapper -->
    <line x1="0" y1="50" x2="0" y2="100" stroke="#B8860B" stroke-width="4" stroke-linecap="round" />
    <circle cx="0" cy="112" r="16" fill="url(#clapperGrad)" stroke="#B8860B" stroke-width="2" />

    <!-- Sound waves (subtle) -->
    <path d="M 130,-20 Q 150,-20 150,-60 Q 150,-100 130,-100" fill="none" stroke="url(#bellGrad)" stroke-width="3" stroke-linecap="round" opacity="0.4" />
    <path d="M 140,-10 Q 165,-10 165,-60 Q 165,-110 140,-110" fill="none" stroke="url(#bellGrad)" stroke-width="2" stroke-linecap="round" opacity="0.25" />
  </g>

  <!-- Brand name -->
  <text x="256" y="440" text-anchor="middle"
        font-family="'Playfair Display', Georgia, serif"
        font-size="48" font-weight="700"
        fill="url(#textGrad)"
        letter-spacing="0.08em">
    CONCIERGE
  </text>
  <text x="256" y="475" text-anchor="middle"
        font-family="'Inter', -apple-system, sans-serif"
        font-size="16" font-weight="400"
        fill="#C9A84C"
        letter-spacing="0.15em">
    VIRTUAL HOSPITALITY
  </text>
</svg>
