<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" fill="none">
  <defs>
    <linearGradient id="amberGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C8962E"/>
      <stop offset="100%" stop-color="#D4A843"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2A7A8C"/>
      <stop offset="100%" stop-color="#3A9AAC"/>
    </linearGradient>
  </defs>

  <!-- Icon: Abstract "A" monogram with data/network motif -->
  <g transform="translate(12, 10)">
    <!-- Main A structure: two angled strokes -->
    <polygon points="48,0 32,100 38,100 48,30 58,100 64,100" fill="#1B2A4A"/>
    
    <!-- Crossbar: emphasized horizontal band -->
    <rect x="30" y="56" width="36" height="4" rx="2" fill="url(#amberGrad)"/>
    
    <!-- Data node at apex -->
    <circle cx="48" cy="0" r="5" fill="url(#amberGrad)"/>
    <circle cx="48" cy="0" r="2.5" fill="#1B2A4A"/>
    
    <!-- Connection from apex down -->
    <line x1="48" y1="5" x2="48" y2="12" stroke="url(#amberGrad)" stroke-width="1.5"/>
    <circle cx="48" cy="14" r="2" fill="url(#tealGrad)"/>
    
    <!-- Data nodes along strokes -->
    <circle cx="61" cy="80" r="2" fill="url(#tealGrad)"/>
    <circle cx="35" cy="80" r="2" fill="url(#tealGrad)"/>
    <line x1="49" y1="62" x2="61" y2="78" stroke="url(#tealGrad)" stroke-width="0.8" opacity="0.4"/>
    <line x1="47" y1="62" x2="35" y2="78" stroke="url(#tealGrad)" stroke-width="0.8" opacity="0.4"/>

    <!-- Base node -->
    <circle cx="48" cy="100" r="2.5" fill="#1B2A4A" stroke="url(#amberGrad)" stroke-width="0.8"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(95, 12)">
    <!-- ASHTABULA COUNTY -->
    <text x="0" y="24" font-family="'Libre Baskerville', Georgia, 'Times New Roman', serif" font-size="10" font-weight="400" fill="#64748B" letter-spacing="3.5">ASHTABULA COUNTY</text>
    
    <!-- DATA BOARD -->
    <text x="-1" y="58" font-family="'Libre Baskerville', Georgia, 'Times New Roman', serif" font-size="22" font-weight="700" fill="#1B2A4A" letter-spacing="1.5">DATA BOARD</text>
    
    <!-- Decorative rule -->
    <rect x="0" y="68" width="50" height="2.5" rx="1.25" fill="url(#amberGrad)"/>
    
    <!-- IT SERVICES -->
    <text x="0" y="90" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="url(#tealGrad)" letter-spacing="3">IT SERVICES</text>
  </g>
</svg>
