<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <pattern id="data-grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1B3A5C" stroke-width="0.5" opacity="0.06"/>
    </pattern>
    <pattern id="data-dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#C8960E" opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="200" height="200" fill="url(#data-grid)"/>
  <rect width="200" height="200" fill="url(#data-dots)"/>
</svg>
