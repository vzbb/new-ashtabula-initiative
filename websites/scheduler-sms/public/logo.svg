<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 130" fill="none">
  <defs>
    <linearGradient id="flame-core" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="40%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="flame-outer" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#9a3412"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="brand-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1B2A4A"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>

  <!-- Background shield / badge shape -->
  <rect x="8" y="10" width="90" height="110" rx="16" fill="#1B2A4A" opacity="0.04"/>

  <!-- Outer flame glow -->
  <path d="M 53 107
           C 53 107, 18 76, 18 54
           C 18 32, 34 16, 53 16
           C 72 16, 88 32, 88 54
           C 88 76, 53 107, 53 107 Z"
        fill="url(#flame-outer)" opacity="0.25"/>

  <!-- Main flame -->
  <path d="M 53 100
           C 53 100, 24 72, 24 52
           C 24 34, 38 22, 53 22
           C 68 22, 82 34, 82 52
           C 82 72, 53 100, 53 100 Z"
        fill="url(#flame-core)"/>

  <!-- Inner flame highlight -->
  <path d="M 53 88
           C 53 88, 32 64, 32 48
           C 32 36, 42 26, 53 26
           C 64 26, 74 36, 74 48
           C 74 64, 53 88, 53 88 Z"
        fill="#fef3c7" opacity="0.6"/>

  <!-- Flame bright core -->
  <path d="M 53 76
           C 53 76, 38 58, 38 46
           C 38 38, 45 30, 53 30
           C 61 30, 68 38, 68 46
           C 68 58, 53 76, 53 76 Z"
        fill="#ffffff" opacity="0.5"/>

  <!-- Heat waves (right side of flame) -->
  <path d="M 88 38 Q 96 34, 104 38 Q 112 42, 120 38" stroke="#f97316" stroke-width="2" fill="none" opacity="0.5" stroke-linecap="round"/>
  <path d="M 88 50 Q 96 46, 104 50 Q 112 54, 120 50" stroke="#f97316" stroke-width="1.5" fill="none" opacity="0.35" stroke-linecap="round"/>
  <path d="M 88 62 Q 96 58, 104 62 Q 112 66, 120 62" stroke="#f97316" stroke-width="1" fill="none" opacity="0.2" stroke-linecap="round"/>

  <!-- Temperature gauge bar -->
  <rect x="88" y="20" width="5" height="82" rx="2.5" fill="#2563EB" opacity="0.12"/>
  <rect x="88" y="20" width="5" height="30" rx="2.5" fill="#2563EB"/>

  <!-- Company name -->
  <text x="122" y="48" font-family="'Barlow Condensed', 'Oswald', 'Arial Narrow', system-ui, sans-serif" font-size="36" font-weight="700" fill="#1B2A4A" letter-spacing="0.03em">Blank Heating</text>
  <text x="122" y="72" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="500" fill="#475569" letter-spacing="0.1em" text-transform="uppercase">Company Inc</text>

  <!-- Tagline -->
  <text x="122" y="90" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="400" fill="#94A3B8" letter-spacing="0.03em">Heating • Cooling • Air Quality</text>

  <!-- Heritage badge -->
  <rect x="122" y="98" width="158" height="24" rx="12" fill="#FFF3E8"/>
  <text x="201" y="114" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="600" fill="#C2410C" text-anchor="middle" letter-spacing="0.08em">THREE GENERATIONS • ASHTABULA OH</text>

  <!-- OH LIC -->
  <text x="294" y="72" font-family="'Inter', system-ui, sans-serif" font-size="9" font-weight="500" fill="#CBD5E1" letter-spacing="0.05em">OH LIC #25138</text>
</svg>
