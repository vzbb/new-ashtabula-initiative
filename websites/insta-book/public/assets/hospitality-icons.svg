<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 600 400">
  <!-- Hospitality icon set for The Lakehouse Inn brand -->
  <defs>
    <style>
      .icon-stroke { stroke: #1B2A4A; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .icon-fill { fill: #1B2A4A; }
      .icon-accent { stroke: #2E6F95; stroke-width: 1.5; stroke-linecap: round; fill: none; }
      .icon-gold { fill: #E8A87C; stroke: none; }
      .icon-label { font-family: 'Inter', sans-serif; font-size: 11px; fill: #2E6F95; text-anchor: middle; letter-spacing: 1; }
    </style>
  </defs>

  <!-- 1. Wine Glass (Lodging/Winery) -->
  <g transform="translate(55, 40)">
    <line x1="50" y1="80" x2="50" y2="110" class="icon-stroke"/>
    <line x1="30" y1="110" x2="70" y2="110" class="icon-stroke"/>
    <path d="M50 10 Q30 10 30 40 Q30 65 50 80 Q70 65 70 40 Q70 10 50 10Z" class="icon-stroke"/>
    <path d="M40 35 Q50 65 60 35" class="icon-accent"/>
    <circle cx="50" cy="25" r="3" class="icon-gold"/>
    <text x="50" y="135" class="icon-label">WINE</text>
  </g>

  <!-- 2. Bed/Moon (Lodging) -->
  <g transform="translate(195, 40)">
    <!-- Bed frame -->
    <rect x="15" y="50" width="70" height="40" rx="3" class="icon-stroke"/>
    <!-- Pillow -->
    <rect x="20" y="20" width="60" height="30" rx="3" class="icon-stroke"/>
    <!-- Headboard accent -->
    <line x1="30" y1="20" x2="30" y2="0" class="icon-stroke"/>
    <line x1="70" y1="20" x2="70" y2="0" class="icon-stroke"/>
    <line x1="30" y1="0" x2="70" y2="0" class="icon-stroke"/>
    <!-- Moon (romance) -->
    <circle cx="80" cy="12" r="8" class="icon-stroke"/>
    <circle cx="83" cy="10" r="6" fill="#FFF8F0" class="icon-gold" style="fill: #E8A87C; opacity: 0.6;"/>
    <text x="50" y="115" class="icon-label">STAY</text>
  </g>

  <!-- 3. Fork & Knife (Dining) -->
  <g transform="translate(380, 40)">
    <path d="M30 0 L30 80 Q30 90 20 90" class="icon-stroke"/>
    <path d="M30 0 L30 80 Q30 90 40 90" class="icon-stroke"/>
    <path d="M70 0 L70 80 Q70 90 60 90" class="icon-stroke"/>
    <path d="M50 100 L50 80" class="icon-stroke"/>
    <path d="M15 0 Q15 30 30 45" class="icon-accent"/>
    <circle cx="50" cy="10" r="3" class="icon-gold"/>
    <text x="50" y="125" class="icon-label">DINE</text>
  </g>

  <!-- 4. Spa Leaf/Lotus (Spa) -->
  <g transform="translate(480, 40)">
    <!-- Lotus petals -->
    <path d="M50 70 L30 30 Q35 15 50 25" class="icon-stroke"/>
    <path d="M50 70 L70 30 Q65 15 50 25" class="icon-stroke"/>
    <path d="M50 70 L40 20 Q45 10 50 15" class="icon-stroke"/>
    <path d="M50 70 L60 20 Q55 10 50 15" class="icon-stroke"/>
    <path d="M50 70 L50 10 Q55 5 50 0" class="icon-stroke"/>
    <!-- Base -->
    <path d="M25 80 Q50 90 75 80" class="icon-stroke"/>
    <!-- Leaf accent -->
    <path d="M70 40 Q85 35 80 50" class="icon-accent"/>
    <text x="50" y="115" class="icon-label">SPA</text>
  </g>

  <!-- 5. Calendar/Events (Events) -->
  <g transform="translate(30, 210)">
    <rect x="10" y="20" width="80" height="70" rx="5" class="icon-stroke"/>
    <line x1="10" y1="45" x2="90" y2="45" class="icon-stroke"/>
    <line x1="30" y1="10" x2="30" y2="30" class="icon-stroke"/>
    <line x1="70" y1="10" x2="70" y2="30" class="icon-stroke"/>
    <text x="50" y="68" font-family="'Playfair Display', Georgia, serif" font-size="20" font-weight="600" fill="#1B2A4A" text-anchor="middle">
      <tspan x="50" dy="0">EVENTS</tspan>
    </text>
    <text x="50" y="115" class="icon-label">CELEBRATE</text>
  </g>

  <!-- 6. Lake/Wave (Location) -->
  <g transform="translate(180, 210)">
    <!-- Sun -->
    <circle cx="50" cy="35" r="18" class="icon-stroke" stroke-width="2.5"/>
    <circle cx="50" cy="35" r="8" class="icon-gold" opacity="0.5"/>
    <path d="M50 53 Q25 60 10 70" class="icon-stroke"/>
    <path d="M50 60 Q15 70 0 85" class="icon-stroke"/>
    <path d="M50 53 Q75 60 90 70" class="icon-stroke"/>
    <path d="M50 60 Q85 70 100 85" class="icon-stroke"/>
    <line x1="5" y1="85" x2="95" y2="85" class="icon-stroke" stroke-dasharray="3 2"/>
    <text x="50" y="115" class="icon-label">LAKE ERIE</text>
  </g>

  <!-- Labels -->
  <text x="530" y="215" font-family="'Inter', sans-serif" font-size="8" fill="#D4C5A9" text-anchor="end" letter-spacing="1">THE LAKEHOUSE INN</text>
  <text x="530" y="228" font-family="'Playfair Display', Georgia, serif" font-size="14" font-weight="600" fill="#1B2A4A" text-anchor="end" letter-spacing="2">ESSENTIALS</text>
  <line x1="430" y1="235" x2="530" y2="235" stroke="#D4C5A9" stroke-width="0.5"/>
</svg>
