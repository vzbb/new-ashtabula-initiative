<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <!-- Wave pattern tile -->
    <pattern id="lakeWaves" x="0" y="0" width="200" height="40" patternUnits="userSpaceOnUse">
      <!-- Subtle wave line 1 -->
      <path d="M0 20 Q25 12 50 20 Q75 28 100 20 Q125 12 150 20 Q175 28 200 20" 
            stroke="#1B2A4A" stroke-width="0.5" fill="none" opacity="0.06"/>
      <!-- Wave line 2 offset -->
      <path d="M0 30 Q25 24 50 30 Q75 36 100 30 Q125 24 150 30 Q175 36 200 30" 
            stroke="#2E6F95" stroke-width="0.4" fill="none" opacity="0.04"/>
    </pattern>

    <!-- Sunset glow gradient -->
    <radialGradient id="sunsetGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#E8A87C" stop-opacity="0.04"/>
      <stop offset="50%" stop-color="#E8B4B4" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#1B2A4A" stop-opacity="0"/>
    </radialGradient>

    <!-- Horizon line pattern -->
    <pattern id="horizonLines" x="0" y="0" width="200" height="200" patternUnits="userSpaceOnUse">
      <line x1="0" y1="160" x2="200" y2="160" stroke="#1B2A4A" stroke-width="0.3" opacity="0.05"/>
      <circle cx="100" cy="155" r="8" fill="#E8A87C" opacity="0.04"/>
      <!-- Vineyard rows -->
      <path d="M10 180 L10 195 M30 180 L30 195 M50 180 L50 195 M70 180 L70 195 M90 180 L90 195 M110 180 L110 195 M130 180 L130 195 M150 180 L150 195 M170 180 L170 195 M190 180 L190 195" 
            stroke="#5B7B5A" stroke-width="0.4" opacity="0.04"/>
    </pattern>
  </defs>

  <!-- Layer 1: Sunset glow -->
  <rect width="400" height="400" fill="url(#sunsetGlow)"/>

  <!-- Layer 2: Lake waves -->
  <rect width="400" height="400" fill="url(#lakeWaves)"/>

  <!-- Layer 3: Horizon elements -->
  <rect width="400" height="400" fill="url(#horizonLines)"/>

  <!-- Single large horizon accent -->
  <line x1="0" y1="280" x2="400" y2="280" stroke="#1B2A4A" stroke-width="0.6" opacity="0.08"/>
  <circle cx="200" cy="272" r="12" fill="#E8A87C" opacity="0.06"/>
  
  <!-- Gentle wave arcs across the bottom -->
  <path d="M-50 340 Q0 330 50 340 Q100 350 150 340 Q200 330 250 340 Q300 350 350 340 Q400 330 450 340" 
        stroke="#2E6F95" stroke-width="0.6" fill="none" opacity="0.05"/>
  <path d="M-50 355 Q0 347 50 355 Q100 363 150 355 Q200 347 250 355 Q300 363 350 355 Q400 347 450 355" 
        stroke="#1B2A4A" stroke-width="0.4" fill="none" opacity="0.04"/>
</svg>
