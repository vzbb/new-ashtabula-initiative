<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- Warm Coral Gradient -->
    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E87461"/>
      <stop offset="100%" style="stop-color:#D15B4A"/>
    </linearGradient>
    <!-- Soft shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#3D3D3D" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Circular badge background -->
  <circle cx="200" cy="200" r="190" fill="url(#coralGrad)" filter="url(#shadow)"/>

  <!-- Inner cream circle -->
  <circle cx="200" cy="200" r="170" fill="#FFF8F0"/>

  <!-- Thin teal accent ring -->
  <circle cx="200" cy="200" r="170" fill="none" stroke="#5CBCC0" stroke-width="2.5" opacity="0.4"/>

  <!-- Heart shape — the core icon mark -->
  <!-- A heart formed by two overlapping circles and a triangle -->
  <path d="M 200 290
           C 170 260, 110 220, 110 175
           C 110 145, 135 120, 165 120
           C 185 120, 198 135, 200 145
           C 202 135, 215 120, 235 120
           C 265 120, 290 145, 290 175
           C 290 220, 230 260, 200 290 Z"
        fill="url(#coralGrad)" opacity="0.9"/>

  <!-- Dog silhouette in left lobe of heart — sitting profile facing right -->
  <g transform="translate(135, 170)" fill="#FFF8F0">
    <!-- Dog body -->
    <ellipse cx="28" cy="28" rx="22" ry="14"/>
    <!-- Dog head -->
    <circle cx="46" cy="16" r="10"/>
    <!-- Dog ear -->
    <ellipse cx="40" cy="8" rx="5" ry="9" transform="rotate(-15, 40, 8)"/>
    <!-- Dog snout -->
    <ellipse cx="55" cy="18" rx="7" ry="5"/>
    <!-- Tail stub -->
    <path d="M 8 24 Q 2 16 6 10" fill="none" stroke="#FFF8F0" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Cat silhouette in right lobe of heart — sitting profile facing left -->
  <g transform="translate(225, 172)" fill="#FFF8F0">
    <!-- Cat body -->
    <ellipse cx="18" cy="26" rx="18" ry="12"/>
    <!-- Cat head -->
    <circle cx="10" cy="14" r="9"/>
    <!-- Cat ears -->
    <polygon points="4,6 2,-2 10,4" fill="#FFF8F0"/>
    <polygon points="10,4 18,-2 16,6" fill="#FFF8F0"/>
    <!-- Tail curling up -->
    <path d="M 35 24 Q 44 22 44 12 Q 44 4 48 4"
          fill="none" stroke="#FFF8F0" stroke-width="3" stroke-linecap="round"/>
    <!-- Whiskers -->
    <line x1="3" y1="17" x2="-5" y2="15" stroke="#FFF8F0" stroke-width="0.8" opacity="0.6"/>
    <line x1="3" y1="19" x2="-6" y2="20" stroke="#FFF8F0" stroke-width="0.8" opacity="0.6"/>
  </g>

  <!-- Small paw print at the bottom point of the heart -->
  <g transform="translate(192, 265)" fill="#FDE8D0" opacity="0.6">
    <!-- Main pad -->
    <ellipse cx="8" cy="6" rx="6" ry="5"/>
    <!-- Toe pads -->
    <circle cx="2" cy="-1" r="2.5"/>
    <circle cx="8" cy="-4" r="2.5"/>
    <circle cx="14" cy="-1" r="2.5"/>
  </g>

  <!-- Teal accent mark — small leaf/whisker detail at the sides -->
  <path d="M 88 175 Q 78 165 82 155" fill="none" stroke="#5CBCC0" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <path d="M 312 175 Q 322 165 318 155" fill="none" stroke="#5CBCC0" stroke-width="2" stroke-linecap="round" opacity="0.4"/>

</svg>
