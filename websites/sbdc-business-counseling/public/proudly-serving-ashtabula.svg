<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3a5c"/>
      <stop offset="100%" style="stop-color:#0f2840"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c8a052"/>
      <stop offset="100%" style="stop-color:#e8c06a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Outer circle -->
  <circle cx="200" cy="200" r="195" fill="url(#bg)" stroke="url(#accent)" stroke-width="4" filter="url(#shadow)"/>
  <circle cx="200" cy="200" r="185" fill="none" stroke="url(#accent)" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Inner circle -->
  <circle cx="200" cy="200" r="175" fill="none" stroke="url(#accent)" stroke-width="1"/>

  <!-- Star icon -->
  <polygon points="200,85 215,140 275,140 228,172 245,228 200,196 155,228 172,172 125,140 185,140"
           fill="url(#accent)" opacity="0.85"/>

  <!-- Arc text top: "PROUDLY SERVING" -->
  <path id="top-arc" d="M 90,185 A 130 130 0 0 1 310,185" fill="none"/>
  <text font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="700" fill="#e8c06a" letter-spacing="4">
    <textPath href="#top-arc" startOffset="50%" text-anchor="middle">PROUDLY SERVING</textPath>
  </text>

  <!-- Arc text bottom: "ASHTABULA COUNTY" -->
  <path id="bottom-arc" d="M 85,215 A 140 140 0 0 0 315,215" fill="none"/>
  <text font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="700" fill="#e8c06a" letter-spacing="3">
    <textPath href="#bottom-arc" startOffset="50%" text-anchor="middle">ASHTABULA COUNTY</textPath>
  </text>

  <!-- Center text: "SINCE 1986" -->
  <text x="200" y="262" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="700"
        fill="#ffffff" text-anchor="middle" letter-spacing="3">SINCE 1986</text>

  <!-- Small decorative lines -->
  <line x1="155" y1="275" x2="245" y2="275" stroke="url(#accent)" stroke-width="1"/>

  <!-- Bottom tagline -->
  <text x="200" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400"
        fill="#8899aa" text-anchor="middle" letter-spacing="2">NEW ASHTABULA INITIATIVE</text>
</svg>
