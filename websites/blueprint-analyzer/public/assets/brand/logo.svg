<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" fill="none">
  <defs>
    <!-- Blueprint major grid (large squares) -->
    <pattern id="gridMajor" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="translate(60, 20)">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#2A6FB0" stroke-width="0.6" opacity="0.12"/>
    </pattern>
    <!-- Blueprint minor grid (small squares) -->
    <pattern id="gridMinor" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="translate(60, 20)">
      <path d="M 6 0 L 0 0 0 6" fill="none" stroke="#2A6FB0" stroke-width="0.3" opacity="0.06"/>
    </pattern>
    <!-- Blueprint blue gradient for the mark background -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1B3A5C"/>
      <stop offset="100%" stop-color="#1E4D8C"/>
    </linearGradient>
    <!-- Glow for the amber accent -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ===== BRAND MARK (left) ===== -->
  <g transform="translate(40, 20)">
    <!-- Badge / shield background -->
    <rect x="0" y="0" width="200" height="200" rx="28" fill="url(#bgGrad)"/>
    
    <!-- Grid overlays -->
    <rect x="0" y="0" width="200" height="200" rx="28" fill="url(#gridMajor)"/>
    <rect x="0" y="0" width="200" height="200" rx="28" fill="url(#gridMinor)"/>

    <!-- Architectural border frame (title block border) -->
    <rect x="14" y="14" width="172" height="172" rx="14" fill="none" stroke="white" stroke-width="1.5" opacity="0.2"/>
    <rect x="18" y="18" width="164" height="164" rx="11" fill="none" stroke="white" stroke-width="0.5" opacity="0.15"/>

    <!-- Corner registration marks -->
    <path d="M14 28 L14 14 L28 14" fill="none" stroke="white" stroke-width="1.5" opacity="0.3"/>
    <path d="M186 14 L172 14 L172 28" fill="none" stroke="white" stroke-width="1.5" opacity="0.3" transform="translate(200,0) scale(-1,1)"/>
    <path d="M14 172 L14 186 L28 186" fill="none" stroke="white" stroke-width="1.5" opacity="0.3"/>
    <path d="M186 186 L172 186 L172 172" fill="none" stroke="white" stroke-width="1.5" opacity="0.3" transform="translate(200,200) scale(-1,-1)"/>

    <!-- ===== Drafting triangle (primary geometry) ===== -->
    <polygon points="100,170 44,44 156,44" fill="none" stroke="white" stroke-width="3" stroke-linejoin="round" opacity="0.92"/>
    <polygon points="100,170 44,44 156,44" fill="none" stroke="#D97706" stroke-width="0.8" stroke-linejoin="round" opacity="0.3"/>

    <!-- 30°/60° angle tick on left edge -->
    <line x1="44" y1="44" x2="100" y2="170" stroke="white" stroke-width="0.5" opacity="0.3"/>
    <circle cx="100" cy="170" r="2" fill="white" opacity="0.3"/>

    <!-- ===== Building section elevation inside the triangle ===== -->
    <!-- Main structure outline -->
    <g opacity="0.85">
      <!-- Building walls -->
      <rect x="70" y="85" width="60" height="75" fill="none" stroke="white" stroke-width="2"/>
      <!-- Interior floor line -->
      <line x1="70" y1="120" x2="130" y2="120" stroke="white" stroke-width="1.2" opacity="0.6"/>
      <!-- Roof / gable -->
      <polyline points="65,85 100,58 135,85" fill="none" stroke="white" stroke-width="2" stroke-linejoin="round"/>
      <!-- Window openings -->
      <rect x="78" y="95" width="14" height="18" fill="none" stroke="white" stroke-width="1.2" opacity="0.5"/>
      <rect x="108" y="95" width="14" height="18" fill="none" stroke="white" stroke-width="1.2" opacity="0.5"/>
      <!-- Door opening -->
      <rect x="88" y="130" width="24" height="30" fill="none" stroke="white" stroke-width="1.2" opacity="0.5"/>
      <!-- Foundation line -->
      <line x1="65" y1="160" x2="135" y2="160" stroke="white" stroke-width="2.5" opacity="0.4"/>
    </g>

    <!-- ===== Dimension / annotation marks ===== -->
    <!-- Dimension line left -->
    <line x1="52" y1="85" x2="56" y2="85" stroke="white" stroke-width="0.8" opacity="0.35"/>
    <line x1="52" y1="160" x2="56" y2="160" stroke="white" stroke-width="0.8" opacity="0.35"/>
    <line x1="54" y1="85" x2="54" y2="160" stroke="white" stroke-width="0.5" opacity="0.2"/>
    <text x="52" y="126" fill="white" font-size="7" font-family="'Courier New', monospace" text-anchor="middle" opacity="0.35" transform="rotate(-90, 52, 126)" letter-spacing="1">36'-0"</text>

    <!-- ===== Approval stamp accent (bottom-right of mark) ===== -->
    <g transform="translate(140, 155) rotate(-8)">
      <rect x="0" y="0" width="52" height="34" rx="4" fill="none" stroke="#D97706" stroke-width="2" opacity="0.9"/>
      <rect x="3" y="3" width="46" height="28" rx="2" fill="none" stroke="#D97706" stroke-width="0.5" opacity="0.4"/>
      <text x="26" y="14" fill="#D97706" font-size="8" font-family="'Courier New', monospace" text-anchor="middle" font-weight="bold" letter-spacing="1.5" opacity="0.9">APPROVED</text>
      <text x="26" y="24" fill="#D97706" font-size="5" font-family="'Courier New', monospace" text-anchor="middle" letter-spacing="0.5" opacity="0.6">ASHTABULA CO.</text>
    </g>

    <!-- ===== Crosshair / annotation callout ===== -->
    <g transform="translate(120, 74)" opacity="0.5">
      <circle cx="0" cy="0" r="4" fill="none" stroke="#D97706" stroke-width="1"/>
      <line x1="-7" y1="0" x2="-5" y2="0" stroke="#D97706" stroke-width="0.8"/>
      <line x1="5" y1="0" x2="7" y2="0" stroke="#D97706" stroke-width="0.8"/>
      <line x1="0" y1="-7" x2="0" y2="-5" stroke="#D97706" stroke-width="0.8"/>
      <line x1="0" y1="5" x2="0" y2="7" stroke="#D97706" stroke-width="0.8"/>
    </g>
  </g>

  <!-- ===== WORDMARK (right) ===== -->
  <g transform="translate(280, 60)">
    <!-- Main wordmark -->
    <text x="0" y="64" fill="#1B3A5C" font-size="60" font-family="'Inter', 'system-ui', '-apple-system', sans-serif" font-weight="700" letter-spacing="10">BLUEPRINT</text>

    <!-- Subtitle -->
    <text x="2" y="94" fill="#5D6D7E" font-size="15" font-family="'Inter', 'system-ui', sans-serif" font-weight="400" letter-spacing="5">DIGITAL PLAN REVIEW</text>

    <!-- Accent divider line -->
    <line x1="2" y1="108" x2="220" y2="108" stroke="#D97706" stroke-width="2.5" opacity="0.6"/>

    <!-- Location / authority tag -->
    <text x="2" y="132" fill="#7F8C9B" font-size="11" font-family="'Inter', 'system-ui', sans-serif" font-weight="300" letter-spacing="3">ASHTABULA COUNTY · OHIO</text>

    <!-- Tagline -->
    <text x="2" y="158" fill="#1B4F72" font-size="13" font-family="'Inter', 'system-ui', sans-serif" font-weight="500" letter-spacing="1">Digital Blueprints. Faster Reviews. Better Buildings.</text>
  </g>
</svg>
