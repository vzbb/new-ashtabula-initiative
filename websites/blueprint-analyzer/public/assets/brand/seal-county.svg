<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="500" height="120">
  <defs>
    <style>
      .seal-a { fill: #1B4F72; }
      .seal-build { fill: #F8F9FA; }
      .seal-name { fill: #1B4F72; font-family: 'Merriweather', Georgia, serif; font-weight: 700; }
      .seal-sub { fill: #5D6D7E; font-family: 'Lato', 'Arial', sans-serif; font-weight: 700; letter-spacing: 0.15em; }
      .seal-line { stroke: #1B4F72; stroke-width: 1.5; }
      .seal-tag { fill: #2980B9; font-family: 'Lato', 'Arial', sans-serif; font-style: italic; }
    </style>
  </defs>

  <!-- Official Ashtabula County Seal -->
  <!-- Stylized "A" with courthouse -->
  <g transform="translate(8, 8)">
    <path d="M 8 104 L 22 8 L 98 8 L 112 104 Z" fill="#1B4F72"/>
    <rect x="22" y="60" width="76" height="9" fill="#F8F9FA"/>
    
    <!-- Courthouse -->
    <rect x="42" y="20" width="38" height="40" fill="#F8F9FA"/>
    <rect x="55" y="8" width="12" height="52" fill="#F8F9FA"/>
    <polygon points="55,8 61,0 67,8" fill="#F8F9FA"/>
    <rect x="38" y="20" width="46" height="4" fill="#1B4F72"/>
    <!-- Windows -->
    <rect x="46" y="27" width="6" height="8" fill="#1B4F72"/>
    <rect x="55" y="27" width="6" height="8" fill="#1B4F72"/>
    <rect x="64" y="27" width="6" height="8" fill="#1B4F72"/>
    <rect x="73" y="27" width="6" height="8" fill="#1B4F72"/>
    <rect x="46" y="40" width="6" height="8" fill="#1B4F72"/>
    <rect x="55" y="40" width="6" height="8" fill="#1B4F72"/>
    <rect x="64" y="40" width="6" height="8" fill="#1B4F72"/>
    <rect x="73" y="40" width="6" height="8" fill="#1B4F72"/>
    <rect x="55" y="50" width="10" height="10" fill="#1B4F72" rx="1"/>
    <rect x="51" y="60" width="18" height="2" fill="#1B4F72"/>
    <rect x="48" y="62" width="24" height="2" fill="#1B4F72"/>
  </g>

  <!-- Text -->
  <g transform="translate(140, 12)">
    <text x="0" y="32" font-size="30" class="seal-name">ASHTABULA</text>
    <text x="0" y="55" font-size="13" class="seal-sub">COUNTY, OHIO</text>
    <line x1="0" y1="62" x2="220" y2="62" class="seal-line"/>
    <text x="0" y="83" font-size="11" class="seal-tag">Where great things happen.</text>
  </g>
</svg>
