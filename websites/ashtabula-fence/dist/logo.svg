<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 140" role="img" aria-label="Thomas Fence Co.">
  <defs>
    <linearGradient id="tf-green-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#017f01"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
  </defs>

  <!-- Split-rail fence icon -->
  <g transform="translate(0, 12)">
    <!-- Posts -->
    <rect x="4" y="0" width="8" height="116" rx="2" fill="url(#tf-green-grad)"/>
    <rect x="30" y="0" width="8" height="116" rx="2" fill="url(#tf-green-grad)"/>
    <rect x="56" y="0" width="8" height="116" rx="2" fill="url(#tf-green-grad)"/>

    <!-- Rails (zigzag split-rail pattern) -->
    <polygon points="0,18 34,6 66,18" fill="none" stroke="#017f01" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="0,42 34,30 66,42" fill="none" stroke="#017f01" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="0,66 34,54 66,66" fill="none" stroke="#017f01" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="0,90 34,78 66,90" fill="none" stroke="#017f01" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Company Name -->
  <text x="80" y="50" font-family="Oswald, 'Impact', sans-serif" font-size="36" font-weight="600" fill="#017f01" letter-spacing="3">THOMAS</text>

  <rect x="80" y="58" width="240" height="2" fill="#017f01" opacity="0.3"/>

  <text x="80" y="82" font-family="Oswald, 'Impact', sans-serif" font-size="22" font-weight="400" fill="#14532d" letter-spacing="4">FENCE CO.</text>

  <!-- Tagline -->
  <text x="80" y="102" font-family="Roboto, Arial, sans-serif" font-size="11" fill="#666666" letter-spacing="2">ASHTABULA &amp; NORTHEAST OHIO</text>

  <!-- Since badge -->
  <rect x="340" y="28" width="100" height="80" rx="8" fill="#f3faf3" stroke="#017f01" stroke-width="1.5"/>
  <text x="390" y="54" font-family="Oswald, 'Impact', sans-serif" font-size="14" font-weight="600" fill="#017f01" text-anchor="middle">SINCE</text>
  <text x="390" y="82" font-family="Oswald, 'Impact', sans-serif" font-size="28" font-weight="700" fill="#017f01" text-anchor="middle">1970s</text>
  <text x="390" y="98" font-family="Roboto, Arial, sans-serif" font-size="8" fill="#666666" text-anchor="middle">FAMILY OWNED</text>
</svg>
