<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 120" width="580" height="120">
  <defs>
    <style>
      .renew-text { font-family: 'Libre Baskerville', 'Georgia', 'Times New Roman', serif; font-weight: 700; font-size: 42px; }
      .partners-text { font-family: 'Libre Baskerville', 'Georgia', 'Times New Roman', serif; font-weight: 400; font-size: 34px; }
      .llc-text { font-family: 'Libre Baskerville', 'Georgia', 'Times New Roman', serif; font-weight: 400; font-size: 16px; }
    </style>
  </defs>

  <!-- Architectural Facade Icon -->
  <g transform="translate(2, 8)" fill="none" stroke="#1A1A1A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Pediment (triangular roof) -->
    <polygon points="60,5 10,35 110,35" fill="#1A1A1A" stroke="none"/>
    <!-- Tympanum (inner triangle) -->
    <polygon points="60,12 22,33 98,33" fill="none" stroke="#FFFFFF" stroke-width="1.8"/>
    <!-- Central circle in tympanum -->
    <circle cx="60" cy="24" r="4" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>

    <!-- Horizontal frieze below pediment -->
    <line x1="10" y1="35" x2="110" y2="35" stroke-width="3"/>
    <line x1="10" y1="38" x2="110" y2="38" stroke="#FFFFFF" stroke-width="1.2"/>
    <line x1="10" y1="41" x2="110" y2="41" stroke-width="2"/>

    <!-- Left column -->
    <rect x="18" y="41" width="8" height="62" fill="#1A1A1A" rx="1"/>
    <!-- Left column base -->
    <rect x="14" y="95" width="16" height="5" fill="#1A1A1A" rx="1"/>
    <!-- Left column capital -->
    <rect x="15" y="40" width="14" height="5" fill="#1A1A1A" rx="1"/>

    <!-- Right column -->
    <rect x="94" y="41" width="8" height="62" fill="#1A1A1A" rx="1"/>
    <!-- Right column base -->
    <rect x="90" y="95" width="16" height="5" fill="#1A1A1A" rx="1"/>
    <!-- Right column capital -->
    <rect x="91" y="40" width="14" height="5" fill="#1A1A1A" rx="1"/>

    <!-- Arched doorway between columns -->
    <path d="M 30,100 L 30,60 A 25,25 0 0,1 80,60 L 80,100" fill="#1A1A1A"/>
    <!-- Arch inner highlight -->
    <path d="M 34,100 L 34,62 A 21,21 0 0,1 76,62 L 76,100" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
    <!-- Door panel lines -->
    <line x1="55" y1="68" x2="55" y2="100" stroke="#FFFFFF" stroke-width="1.2"/>
    <line x1="34" y1="82" x2="76" y2="82" stroke="#FFFFFF" stroke-width="1"/>

    <!-- Entablature details -->
    <rect x="14" y="41" width="92" height="3" fill="#1A1A1A" rx="0.5"/>
  </g>

  <!-- "RENEW" text - brand red -->
  <text x="140" y="48" class="renew-text" fill="#B01020" letter-spacing="4">RENEW</text>

  <!-- "PARTNERS" text - dark gray -->
  <text x="140" y="92" class="partners-text" fill="#606060" letter-spacing="3">PARTNERS</text>

  <!-- "LLC" text - dark gray, smaller, offset right of PARTNERS -->
  <text x="405" y="88" class="llc-text" fill="#606060" letter-spacing="1.5">LLC</text>
</svg>
