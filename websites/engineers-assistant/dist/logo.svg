<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <clipPath id="circle-clip">
      <circle cx="200" cy="200" r="195"/>
    </clipPath>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4A843"/>
      <stop offset="50%" style="stop-color:#C8A84E"/>
      <stop offset="100%" style="stop-color:#B8943A"/>
    </linearGradient>
  </defs>

  <!-- Outer blue ring -->
  <circle cx="200" cy="200" r="198" fill="#1B3A5C" stroke="#1B3A5C" stroke-width="4"/>
  <circle cx="200" cy="200" r="195" fill="#1B3A5C"/>

  <!-- Inner gold border -->
  <circle cx="200" cy="200" r="175" fill="none" stroke="url(#gold-grad)" stroke-width="3"/>

  <!-- Top text arc: SEAL OF THE CITY OF ASHTABULA -->
  <path id="top-text-arc" d="M 58 170 A 142 142 0 0 1 342 170" fill="none"/>
  <text font-family="'Georgia', 'Times New Roman', serif" font-size="16" font-weight="700" fill="url(#gold-grad)" letter-spacing="2">
    <textPath href="#top-text-arc" startOffset="50%" text-anchor="middle">SEAL OF THE CITY OF ASHTABULA</textPath>
  </text>

  <!-- Bottom text "OHIO" -->
  <text x="200" y="348" font-family="'Georgia', 'Times New Roman', serif" font-size="20" font-weight="700" fill="url(#gold-grad)" text-anchor="middle" letter-spacing="6">OHIO</text>

  <!-- White background for inner seal area -->
  <circle cx="200" cy="200" r="170" fill="#FAFAF7"/>
  <clipPath id="inner-clip">
    <circle cx="200" cy="200" r="170"/>
  </clipPath>

  <g clip-path="url(#inner-clip)">

    <!-- Sunrise with rays -->
    <path d="M 200 60 Q 200 50 200 60" stroke="url(#gold-grad)" stroke-width="1.5" fill="none"/>
    <circle cx="200" cy="95" r="28" fill="url(#gold-grad)" opacity="0.3"/>
    <circle cx="200" cy="95" r="18" fill="url(#gold-grad)" opacity="0.5"/>
    <circle cx="200" cy="95" r="10" fill="url(#gold-grad)"/>
    <!-- Sun rays -->
    <g stroke="url(#gold-grad)" stroke-width="1.2" opacity="0.7">
      <line x1="200" y1="60" x2="200" y2="48"/>
      <line x1="230" y1="68" x2="245" y2="56"/>
      <line x1="170" y1="68" x2="155" y2="56"/>
      <line x1="245" y1="90" x2="258" y2="88"/>
      <line x1="155" y1="90" x2="142" y2="88"/>
    </g>

    <!-- Rolling hills / landscape -->
    <path d="M 90 140 Q 130 110 170 135 Q 200 120 230 130 Q 270 115 310 140 L 310 180 L 90 180 Z" fill="url(#gold-grad)" opacity="0.25"/>
    
    <!-- Trees -->
    <g fill="url(#gold-grad)" opacity="0.5">
      <polygon points="120,135 125,110 130,135"/>
      <polygon points="135,130 140,108 145,130"/>
      <polygon points="255,125 260,105 265,125"/>
      <polygon points="270,128 275,112 280,128"/>
    </g>

    <!-- Locomotive -->
    <g fill="url(#gold-grad)" opacity="0.9">
      <!-- boiler -->
      <rect x="130" y="148" width="55" height="22" rx="3"/>
      <!-- cab -->
      <rect x="180" y="138" width="18" height="32" rx="2"/>
      <!-- wheels -->
      <circle cx="145" cy="175" r="7" fill="none" stroke="url(#gold-grad)" stroke-width="2"/>
      <circle cx="165" cy="175" r="7" fill="none" stroke="url(#gold-grad)" stroke-width="2"/>
      <circle cx="185" cy="175" r="7" fill="none" stroke="url(#gold-grad)" stroke-width="2"/>
      <!-- smokestack -->
      <rect x="140" y="130" width="8" height="18" rx="2"/>
      <!-- cowcatcher -->
      <polygon points="130,170 118,178 118,182 130,182"/>
    </g>

    <!-- Sheaves of wheat / agriculture -->
    <g fill="url(#gold-grad)" opacity="0.7">
      <path d="M 265 140 Q 270 125 275 140" stroke="url(#gold-grad)" stroke-width="1.5" fill="none"/>
      <path d="M 268 138 Q 270 120 272 138" stroke="url(#gold-grad)" stroke-width="1" fill="none"/>
      <circle cx="270" cy="122" r="3"/>
      <path d="M 280 142 Q 285 128 290 142" stroke="url(#gold-grad)" stroke-width="1.5" fill="none"/>
      <circle cx="285" cy="130" r="3"/>
    </g>

    <!-- Ship on water -->
    <g fill="url(#gold-grad)" opacity="0.85">
      <!-- hull -->
      <path d="M 220 190 L 245 190 L 250 210 L 215 210 Z"/>
      <!-- mast -->
      <line x1="232" y1="190" x2="232" y2="155" stroke="url(#gold-grad)" stroke-width="2"/>
      <!-- sail -->
      <path d="M 235 158 Q 255 168 235 180" fill="url(#gold-grad)" opacity="0.6"/>
      <!-- flag -->
      <polygon points="232,155 240,158 232,161" fill="url(#gold-grad)"/>
      <!-- waves -->
      <path d="M 195 210 Q 210 205 220 210 Q 230 215 245 210 Q 260 205 270 210" stroke="url(#gold-grad)" stroke-width="1.5" fill="none"/>
      <path d="M 200 215 Q 215 210 225 215 Q 235 220 250 215 Q 262 210 270 215" stroke="url(#gold-grad)" stroke-width="1" fill="none"/>
    </g>

    <!-- Native American figures -->
    <g fill="url(#gold-grad)" opacity="0.7">
      <!-- seated figure -->
      <circle cx="115" cy="190" r="6"/>
      <path d="M 115 196 L 115 215" stroke="url(#gold-grad)" stroke-width="2.5"/>
      <path d="M 115 200 L 105 208" stroke="url(#gold-grad)" stroke-width="2"/>
      <path d="M 115 200 L 125 208" stroke="url(#gold-grad)" stroke-width="2"/>
      <!-- long pipe -->
      <line x1="105" y1="195" x2="90" y2="180" stroke="url(#gold-grad)" stroke-width="1.5"/>

      <!-- standing figure -->
      <circle cx="140" cy="178" r="6"/>
      <path d="M 140 184 L 140 205" stroke="url(#gold-grad)" stroke-width="2.5"/>
      <path d="M 140 188 L 130 196" stroke="url(#gold-grad)" stroke-width="2"/>
      <path d="M 140 188 L 150 196" stroke="url(#gold-grad)" stroke-width="2"/>
      <path d="M 140 205 L 132 218" stroke="url(#gold-grad)" stroke-width="2"/>
      <path d="M 140 205 L 148 218" stroke="url(#gold-grad)" stroke-width="2"/>
    </g>

    <!-- Industrial structures bottom right -->
    <g fill="url(#gold-grad)" opacity="0.5">
      <rect x="280" y="185" width="8" height="25"/>
      <rect x="290" y="178" width="12" height="32" rx="2"/>
      <rect x="305" y="188" width="6" height="22"/>
      <circle cx="296" cy="175" r="5" fill="none" stroke="url(#gold-grad)" stroke-width="1.5"/>
    </g>

    <!-- Decorative dots along inner border -->
    <g fill="url(#gold-grad)" opacity="0.4">
      <circle cx="200" cy="34" r="2"/>
      <circle cx="200" cy="366" r="2"/>
      <circle cx="34" cy="200" r="2"/>
      <circle cx="366" cy="200" r="2"/>
      <circle cx="85" cy="85" r="1.5"/>
      <circle cx="315" cy="85" r="1.5"/>
      <circle cx="85" cy="315" r="1.5"/>
      <circle cx="315" cy="315" r="1.5"/>
    </g>

  </g>

  <!-- Dashed inner ring reference -->
  <circle cx="200" cy="200" r="170" fill="none" stroke="url(#gold-grad)" stroke-width="1.5" opacity="0.3"/>
</svg>
