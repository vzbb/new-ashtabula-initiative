  <!-- Copper accent bar (center bar of the plating rack) -->
  <rect x="13.5" y="8" width="5" height="19" rx="1.5" ry="1.5" fill="#C87533" opacity="0.9"/>
  <!-- Steel blue bars on sides -->
  <rect x="7.5" y="12" width="4" height="15" rx="1" ry="1" fill="#4A90D9" opacity="0.85"/>
  <rect x="20.5" y="10" width="4" height="17" rx="1" ry="1" fill="#3B6FA0" opacity="0.85"/>
</svg>
