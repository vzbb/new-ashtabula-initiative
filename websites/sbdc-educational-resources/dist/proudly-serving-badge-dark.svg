<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0c1929"/>
      <stop offset="100%" style="stop-color:#061020"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#d4af37"/>
      <stop offset="100%" style="stop-color:#f0d060"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="200" cy="200" r="195" fill="url(#bg)" stroke="url(#accent)" stroke-width="3"/>
  <circle cx="200" cy="200" r="185" fill="none" stroke="url(#accent)" stroke-width="0.5" stroke-dasharray="3,3"/>

  <polygon points="200,90 213,142 270,142 225,172 240,225 200,195 160,225 175,172 130,142 187,142"
           fill="url(#accent)" opacity="0.9" filter="url(#glow)"/>

  <path id="tarc" d="M 90,185 A 130 130 0 0 1 310,185" fill="none"/>
  <text font-family="Georgia, serif" font-size="16" font-weight="700" fill="url(#accent)" letter-spacing="4">
    <textPath href="#tarc" startOffset="50%" text-anchor="middle">PROUDLY SERVING</textPath>
  </text>

  <path id="barc" d="M 85,215 A 140 140 0 0 0 315,215" fill="none"/>
  <text font-family="Georgia, serif" font-size="18" font-weight="700" fill="url(#accent)" letter-spacing="3">
    <textPath href="#barc" startOffset="50%" text-anchor="middle">ASHTABULA COUNTY</textPath>
  </text>

  <text x="200" y="262" font-family="Georgia, serif" font-size="22" font-weight="700"
        fill="#ffffff" text-anchor="middle" letter-spacing="3" filter="url(#glow)">SINCE 1986</text>

  <line x1="155" y1="278" x2="245" y2="278" stroke="url(#accent)" stroke-width="0.8"/>

  <text x="200" y="315" font-family="system-ui, sans-serif" font-size="9" font-weight="400"
        fill="#667788" text-anchor="middle" letter-spacing="2">NEW ASHTABULA INITIATIVE</text>
</svg>
