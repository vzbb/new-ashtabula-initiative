<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <style>
      .pin { fill: #003366; }
      .dot { fill: #E88121; }
    </style>
  </defs>
  <!-- Route pin icon -->
  <circle cx="16" cy="16" r="14" class="pin"/>
  <circle cx="16" cy="16" r="6" fill="#F7FAFC"/>
  <!-- Route line through pin -->
  <path d="M 6,10 Q 12,8 16,16 T 26,22" fill="none" stroke="#F7FAFC" stroke-width="2" stroke-linecap="round"/>
  <!-- Orange accent dot at start -->
  <circle cx="6" cy="10" r="2.5" class="dot"/>
</svg>
