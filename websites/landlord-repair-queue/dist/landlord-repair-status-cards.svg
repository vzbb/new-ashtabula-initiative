<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <defs>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2c5282"/>
      <stop offset="100%" stop-color="#1f3d63"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38a169"/>
      <stop offset="100%" stop-color="#2f855a"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dd6b20"/>
      <stop offset="100%" stop-color="#c05621"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" rx="24" fill="#f7fafc"/>

  <!-- Title bar -->
  <rect x="40" y="30" width="520" height="50" rx="14" fill="#1f3d63"/>
  <text x="300" y="62" font-family="sans-serif" font-size="18" font-weight="800" fill="white" text-anchor="middle" letter-spacing="1">REPAIR REQUEST QUEUE</text>

  <!-- Card 1: Pending Review -->
  <g transform="translate(40, 110)">
    <rect x="0" y="0" width="520" height="130" rx="16" fill="white" stroke="#2c5282" stroke-width="1.5"/>
    <!-- Left colored strip -->
    <rect x="0" y="0" width="8" height="130" rx="4" fill="#2c5282"/>

    <!-- House/unit icon -->
    <g transform="translate(28, 28)">
      <path d="M0 18 L16 2 L32 18" stroke="#2c5282" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="8" y="16" width="16" height="14" rx="2" fill="#f7fafc" stroke="#2c5282" stroke-width="1.5"/>
    </g>

    <!-- Unit info -->
    <text x="75" y="42" font-family="sans-serif" font-size="16" font-weight="700" fill="#1f3d63">Unit 14B · Harbor Ridge</text>
    <text x="75" y="62" font-family="sans-serif" font-size="13" fill="#617285">Issue: Heating inspection follow-up</text>
    <text x="75" y="82" font-family="sans-serif" font-size="13" fill="#617285">Submitted: Jul 3, 2026</text>

    <!-- Status badge: Pending Review -->
    <g transform="translate(380, 28)">
      <rect x="0" y="0" width="110" height="30" rx="15" fill="#edf3f7" stroke="#2c5282" stroke-width="1.5"/>
      <!-- Clock icon -->
      <circle cx="20" cy="15" r="8" fill="none" stroke="#2c5282" stroke-width="1.5"/>
      <line x1="20" y1="15" x2="20" y2="10" stroke="#2c5282" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="20" y1="15" x2="24" y2="17" stroke="#2c5282" stroke-width="1" stroke-linecap="round"/>
      <text x="38" y="19" font-family="sans-serif" font-size="12" font-weight="700" fill="#2c5282">Pending</text>
    </g>

    <!-- Priority indicator -->
    <g transform="translate(380, 72)">
      <rect x="0" y="0" width="80" height="22" rx="11" fill="#feebc8" stroke="#ed8936" stroke-width="1"/>
      <text x="40" y="15" font-family="sans-serif" font-size="11" font-weight="700" fill="#c05621" text-anchor="middle">This Week</text>
    </g>
  </g>

  <!-- Card 2: In Progress -->
  <g transform="translate(40, 260)">
    <rect x="0" y="0" width="520" height="130" rx="16" fill="white" stroke="#dd6b20" stroke-width="1.5"/>
    <!-- Left colored strip -->
    <rect x="0" y="0" width="8" height="130" rx="4" fill="url(#orangeGrad)"/>

    <!-- House/unit icon -->
    <g transform="translate(28, 28)">
      <path d="M0 18 L16 2 L32 18" stroke="#dd6b20" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="8" y="16" width="16" height="14" rx="2" fill="#f7fafc" stroke="#dd6b20" stroke-width="1.5"/>
    </g>

    <!-- Unit info -->
    <text x="75" y="42" font-family="sans-serif" font-size="16" font-weight="700" fill="#1f3d63">Unit 3A · Lakeside Complex</text>
    <text x="75" y="62" font-family="sans-serif" font-size="13" fill="#617285">Issue: Failed inspection · Bathroom vent</text>
    <text x="75" y="82" font-family="sans-serif" font-size="13" fill="#617285">Inspection: Jul 2, 2026 · Contractor on-site</text>

    <!-- Status badge: In Progress -->
    <g transform="translate(370, 28)">
      <rect x="0" y="0" width="120" height="30" rx="15" fill="#feebc8" stroke="#dd6b20" stroke-width="1.5"/>
      <!-- Wrench icon -->
      <g transform="translate(15, 8)">
        <circle cx="0" cy="0" r="2" fill="#dd6b20"/>
        <rect x="-2" y="0" width="4" height="12" rx="1" fill="#dd6b20"/>
        <rect x="-4" y="10" width="8" height="3" rx="1" fill="#dd6b20"/>
      </g>
      <text x="40" y="19" font-family="sans-serif" font-size="12" font-weight="700" fill="#c05621">In Progress</text>
    </g>

    <!-- Urgency indicator -->
    <g transform="translate(370, 72)">
      <rect x="0" y="0" width="90" height="22" rx="11" fill="#fed7d7" stroke="#e53e3e" stroke-width="1"/>
      <text x="45" y="15" font-family="sans-serif" font-size="11" font-weight="700" fill="#c53030" text-anchor="middle">Urgent</text>
    </g>
  </g>

  <!-- Card 3: Completed -->
  <g transform="translate(40, 410)">
    <rect x="0" y="0" width="520" height="130" rx="16" fill="white" stroke="#38a169" stroke-width="1.5"/>
    <!-- Left colored strip -->
    <rect x="0" y="0" width="8" height="130" rx="4" fill="url(#greenGrad)"/>

    <!-- House/unit icon -->
    <g transform="translate(28, 28)">
      <path d="M0 18 L16 2 L32 18" stroke="#38a169" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="8" y="16" width="16" height="14" rx="2" fill="#f0fff4" stroke="#38a169" stroke-width="1.5"/>
    </g>

    <!-- Unit info -->
    <text x="75" y="42" font-family="sans-serif" font-size="16" font-weight="700" fill="#1f3d63">Unit 7C · Elm Street Housing</text>
    <text x="75" y="62" font-family="sans-serif" font-size="13" fill="#617285">Issue: Voucher documentation update</text>
    <text x="75" y="82" font-family="sans-serif" font-size="13" fill="#617285">Completed: Jul 1, 2026 · Reinspection passed</text>

    <!-- Status badge: Completed -->
    <g transform="translate(380, 28)">
      <rect x="0" y="0" width="110" height="30" rx="15" fill="#f0fff4" stroke="#38a169" stroke-width="1.5"/>
      <!-- Checkmark -->
      <circle cx="20" cy="15" r="9" fill="#38a169"/>
      <path d="M15 15 L18 18 L25 11" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="38" y="19" font-family="sans-serif" font-size="12" font-weight="700" fill="#276749">Complete</text>
    </g>
  </g>
</svg>
