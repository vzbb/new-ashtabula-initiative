<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" aria-label="Food">
  <defs>
    <linearGradient id="food-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <!-- Plate -->
  <circle cx="12" cy="12" r="10" fill="none" stroke="url(#food-accent)" stroke-width="1.8"/>
  <circle cx="12" cy="12" r="7.5" fill="none" stroke="url(#food-accent)" stroke-width="1.2" opacity="0.5"/>
  <!-- Fork (left) -->
  <path d="M 8 2 L 8 10 M 6 3 L 6 7 M 10 3 L 10 7" 
        stroke="url(#food-accent)" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <path d="M 8 10 L 8 14" stroke="url(#food-accent)" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <!-- Knife (right) -->
  <path d="M 16 2 L 16 14" stroke="url(#food-accent)" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <path d="M 14 10 Q 16 8 18 10 L 18 14 L 14 14 Z" 
        fill="url(#food-accent)" stroke="none" opacity="0.85"/>
  <!-- Handle -->
  <rect x="14.2" y="14" width="3.6" height="4" rx="1" 
        fill="url(#food-accent)" opacity="0.7"/>
</svg>
