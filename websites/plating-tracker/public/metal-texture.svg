<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1B2A4A;stop-opacity:1"/>
      <stop offset="40%" style="stop-color:#2C5282;stop-opacity:1"/>
      <stop offset="60%" style="stop-color:#1B2A4A;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#2D3748;stop-opacity:1"/>
    </linearGradient>
    <pattern id="diagonalLines" patternUnits="userSpaceOnUse" width="20" height="20" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="20" stroke="#C87533" stroke-width="0.3" opacity="0.06"/>
    </pattern>
  </defs>
  <!-- Background gradient (navy to charcoal) -->
  <rect width="200" height="200" fill="url(#metalGrad)"/>
  <!-- Diagonal line texture -->
  <rect width="200" height="200" fill="url(#diagonalLines)"/>
  <!-- Copper accent bar at bottom -->
  <rect x="0" y="192" width="200" height="8" fill="#C87533" opacity="0.5" rx="2"/>
</svg>
