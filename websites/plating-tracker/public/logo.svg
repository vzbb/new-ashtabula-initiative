<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 180" width="600" height="180">
  <defs>
    <!-- Navy to Steel Blue gradient for hexagon -->
    <linearGradient id="hexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1B2A4A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2C5282;stop-opacity:1" />
    </linearGradient>
    <!-- Copper gradient for accent -->
    <linearGradient id="copperGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#A0522D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C87533;stop-opacity:1" />
    </linearGradient>
    <!-- Bar gradient fill -->
    <linearGradient id="barGrad1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#3B6FA0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4A90D9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="barGrad2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#C87533;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DD8B4A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="barGrad3" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#1B2A4A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B6FA0;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- ===== LOGO MARK ===== -->
  <g transform="translate(10, 10)">
    <!-- Hexagon outer border -->
    <polygon points="80,0 160,46.2 160,138.6 80,184.8 0,138.6 0,46.2"
             fill="none" stroke="url(#hexGrad)" stroke-width="4" stroke-linejoin="round"/>

    <!-- Hexagon inner fill (slightly smaller) -->
    <polygon points="80,8 152,50 152,136 80,178 8,136 8,50"
             fill="#F7FAFC" stroke="none"/>

    <!-- Decorative inner hex ring -->
    <polygon points="80,18 144,54.5 144,131.5 80,168 16,131.5 16,54.5"
             fill="none" stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="4,3"/>

    <!-- Vertical bars (plating rack + tracking chart motif) -->
    <!-- Bar 1 - Copper accent - tallest -->
    <rect x="35" y="42" width="12" height="104" rx="3" ry="3" fill="url(#copperGrad)" opacity="0.9"/>
    <!-- Bar 2 - Steel blue - medium -->
    <rect x="54" y="62" width="12" height="84" rx="3" ry="3" fill="url(#barGrad1)" opacity="0.85"/>
    <!-- Bar 3 - Navy - tallest -->
    <rect x="73" y="32" width="12" height="114" rx="3" ry="3" fill="url(#barGrad3)" opacity="0.9"/>
    <!-- Bar 4 - Steel blue - short -->
    <rect x="92" y="75" width="12" height="71" rx="3" ry="3" fill="url(#barGrad1)" opacity="0.8"/>
    <!-- Bar 5 - Copper - medium-high -->
    <rect x="111" y="52" width="12" height="94" rx="3" ry="3" fill="url(#copperGrad)" opacity="0.85"/>

    <!-- Small horizontal crossbar (suggests hanger/rack top) -->
    <rect x="30" y="36" width="98" height="4" rx="2" ry="2" fill="#1B2A4A" opacity="0.3"/>

    <!-- Small dot/circle accent at top center (molecular node) -->
    <circle cx="80" cy="14" r="4" fill="#C87533"/>
  </g>

  <!-- ===== WORDMARK ===== -->
  <g transform="translate(200, 10)">
    <!-- "PLATING" -->
    <text x="0" y="62" font-family="'Bebas Neue', 'Industry', 'Oswald', 'Arial Black', sans-serif"
          font-size="52" font-weight="900" letter-spacing="4" fill="#1B2A4A">
      PLATING
    </text>

    <!-- "TRACKER" -->
    <text x="0" y="118" font-family="'Bebas Neue', 'Industry', 'Oswald', 'Arial Black', sans-serif"
          font-size="52" font-weight="900" letter-spacing="4" fill="#1B2A4A">
      TRACKER
    </text>

    <!-- Subtitle / descriptor -->
    <text x="0" y="148" font-family="'Inter', 'Roboto', sans-serif"
          font-size="11" font-weight="600" letter-spacing="3.5" fill="#C87533" text-transform="uppercase">
      JOB MANAGEMENT · QUALITY TRACKING
    </text>

    <!-- Thin rule accent under PLATING -->
    <line x1="0" y1="76" x2="190" y2="76" stroke="#C87533" stroke-width="2" opacity="0.6"/>
  </g>
</svg>
