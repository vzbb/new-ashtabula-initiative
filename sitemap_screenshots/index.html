<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NAI Sitemap Screenshots</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b1020;
        --panel: #11182b;
        --panel-2: #18213a;
        --text: #e5eefc;
        --muted: #9fb0ce;
        --accent: #8dd3ff;
        --warn: #ffd38d;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        background: radial-gradient(circle at top, #152447 0, var(--bg) 45%);
        color: var(--text);
      }
      header {
        padding: 24px 20px 12px;
        max-width: 1440px;
        margin: 0 auto;
      }
      h1 {
        margin: 0 0 8px;
        font-size: clamp(1.5rem, 2.2vw, 2.4rem);
      }
      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.45;
      }
      .summary {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 14px;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        border-radius: 999px;
        background: rgba(141, 211, 255, 0.08);
        border: 1px solid rgba(141, 211, 255, 0.14);
        font-size: 12px;
      }
      .chip strong {
        color: var(--text);
      }
      .chip.tone-warn {
        background: rgba(255, 211, 141, 0.08);
        border-color: rgba(255, 211, 141, 0.16);
      }
      .grid {
        max-width: 1440px;
        margin: 0 auto;
        padding: 12px 16px 40px;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
        gap: 10px;
      }
      .card {
        display: block;
        text-decoration: none;
        color: inherit;
        background: linear-gradient(180deg, var(--panel), var(--panel-2));
        border: 1px solid rgba(141, 211, 255, 0.12);
        border-radius: 14px;
        overflow: hidden;
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.22);
      }
      .card img {
        width: 100%;
        aspect-ratio: 16 / 9;
        object-fit: cover;
        display: block;
        background: #0c1222;
      }
      .meta {
        padding: 10px 10px 12px;
      }
      .headline {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 4px;
      }
      .meta strong {
        display: block;
        font-size: 0.92rem;
        line-height: 1.25;
      }
      .title {
        display: block;
        color: var(--muted);
        line-height: 1.35;
        font-size: 12px;
        margin-bottom: 8px;
      }
      .status {
        flex: 0 0 auto;
        padding: 3px 7px;
        border-radius: 999px;
        background: rgba(141, 211, 255, 0.12);
        color: var(--accent);
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .stats {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 8px;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.35;
        margin-bottom: 8px;
      }
      .stats span {
        padding: 2px 0;
      }
      .mini-fix {
        font-size: 11px;
        color: #d8e8ff;
        line-height: 1.35;
        margin-bottom: 8px;
      }
      .analysis-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 6px 10px;
        font-size: 11px;
        color: var(--muted);
        margin-top: 8px;
      }
      .analysis-grid div,
      .detail-row {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .analysis-grid span,
      .detail-row span {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: #8ea0c5;
      }
      .analysis-grid strong,
      .detail-row strong {
        color: var(--text);
        font-size: 11px;
        line-height: 1.35;
      }
      .warnings {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 10px;
      }
      .warning {
        display: inline-block;
        padding: 3px 7px;
        border-radius: 999px;
        background: rgba(255, 211, 141, 0.12);
        color: var(--warn);
        font-size: 10px;
      }
      .json-details {
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
      }
      .json-details summary {
        cursor: pointer;
        color: var(--accent);
        font-size: 11px;
        list-style: none;
      }
      .json-details summary::-webkit-details-marker {
        display: none;
      }
      .json-details > div {
        margin-top: 6px;
      }
      .analysis-empty {
        margin-top: 8px;
        font-size: 11px;
        color: var(--muted);
      }
      footer {
        max-width: 1440px;
        margin: 0 auto;
        padding: 0 20px 32px;
        color: var(--muted);
        font-size: 12px;
      }
      code {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>NAI Sitemap Screenshots</h1>
      <p>1 captures generated by <code>./nai screenshots</code>.</p>
      
      
      
    </header>
    <main class="grid">
      
            <a class="card" href="001_scheduler-sms.png" target="_blank" rel="noreferrer">
              <img src="001_scheduler-sms.png" alt="scheduler-sms screenshot" loading="lazy" />
              <div class="meta">
                <div class="headline">
                  <strong>scheduler-sms</strong>
                  
                </div>
                <span class="title">service-scheduler-sms</span>
                <div class="stats">
                  <span>live · 525 chars</span>
                  
                  
                  
                </div>
                
                <div class="warnings"></div>
                <div class="analysis-empty">No JSON analysis available yet.</div>
              </div>
            </a>
            
    </main>
    <footer>
      Generated from <code>SITEMAP.md</code>
      .
    </footer>
  </body>
</html>
